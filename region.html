<!-- Mobile drawer -->
<div id="mobileDrawer" style="display:none;position:fixed;inset:0;z-index:200;background:rgba(56,48,38,.4)" onclick="this.style.display='none'">
  <div style="position:absolute;top:0;left:0;right:0;background:var(--parchment);border-radius:0 0 20px 20px;box-shadow:0 8px 32px rgba(60,42,20,.18);padding:0 20px 28px" onclick="event.stopPropagation()">
    <div style="display:flex;align-items:center;justify-content:space-between;min-height:56px">
      <div class="logo"><span class="logo-name">quolino</span><span class="logo-dot">.</span><span class="logo-tld">com</span></div>
      <button onclick="document.getElementById('mobileDrawer').style.display='none'" aria-label="Close" style="width:48px;height:48px;border:none;cursor:pointer;border-radius:12px;background:transparent;display:grid;place-items:center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
      </button>

    <a href="./" onclick="document.getElementById('mobileDrawer').style.display='none'" style="display:flex;align-items:center;justify-content:center;height:52px;background:rgba(180,80,46,.06);border:2px solid var(--terra);border-radius:14px;font-size:18px;font-weight:700;color:var(--terra);margin-bottom:16px" data-ui="nav.select_region">Wybierz region</a>

    <button onclick="document.getElementById('langPopup').classList.add('open');document.getElementById('mobileDrawer').style.display='none'" style="width:100%;height:52px;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:14px;border:2px solid var(--line);background:var(--parchment);cursor:pointer;font-size:18px;font-weight:700;color:var(--ink);margin-bottom:16px">
      <img src="https://flagcdn.com/w40/pl.png" alt="" id="drawerFlagImg" style="width:22px;height:16px;border-radius:3px;border:1px solid rgba(56,48,38,.12);object-fit:cover"> <span data-ui="nav.change_lang">Zmień język</span>

<!-- Language popup -->
<div class="lang-overlay" id="langPopup" onclick="this.classList.remove('open')">
  <div class="lang-popup" onclick="event.stopPropagation()">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <div style="font-size:22px;font-weight:800;letter-spacing:-.015em" data-ui="nav.select_lang">Wybierz język</div>
      <button onclick="document.getElementById('langPopup').classList.remove('open')" aria-label="Close" style="width:44px;height:44px;border:none;cursor:pointer;border-radius:12px;background:transparent;display:grid;place-items:center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>

    <div class="lang-grid" id="langGrid"></div>

<div class="wrap-wide">

  <!-- Breadcrumbs -->
  <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>

  <!-- Region content -->
  <div id="regionContent">
    <div class="state-msg">&#8230;</div>
  </div>

  <div class="footer">
    <div class="logo">
      <span class="logo-name">quolino</span><span class="logo-dot">.</span><span class="logo-tld">com</span>
    </div>
    <span data-ui="home.footer">&copy; 2026 &middot; Rodzinne przewodniki wypadowe</span>
  </div>

</div>

<script>
// ══════════════ CONFIG ══════════════
var SB_URL = 'https://ntwpjcupffdozstbijhh.supabase.co/rest/v1';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50d3BqY3VwZmZkb3pzdGJpamhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMzc5MTUsImV4cCI6MjEwMjgxMzkxNX0.OddjLt-gKKmj2H7wrEKJ14CXrsXu0L4UBO2GC9OiCGo';
var FALLBACK = 'pl';

// ══════════════ STATE ══════════════
var regionSlug  = new URLSearchParams(location.search).get('r');
var currentLang = new URLSearchParams(location.search).get('lang') || readPref() || FALLBACK;
var langList = [];
var uiStrings = {};

// ══════════════ HELPERS ══════════════
function sb(table, params) {
  var url = SB_URL + '/' + table + (params ? '?' + params : '');
  return fetch(url, { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY } })
    .then(function(r) { if (!r.ok) throw new Error(r.status + ' ' + table); return r.json(); });
}
function readPref()  { try { return localStorage.getItem('quolino_lang'); } catch(e) { return null; } }
function savePref(l) { try { localStorage.setItem('quolino_lang', l); } catch(e) {} }
function esc(s) { if (s == null) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function ui(key, fb) { return uiStrings[key] || fb || key; }

// "~{n}h" → "~4h"
function durationLabel(h) { return ui('label.duration_h', '~{n}h').replace('{n}', h); }

// Slavic plural handling for the stop counter
function stopsLabel(n) {
  var slavic = { pl:1, cs:1, sk:1, uk:1, hr:1 };
  var key = 'label.stops_count';
  if (slavic[currentLang]) {
    var m = n % 10, h = n % 100;
    if (m >= 2 && m <= 4 && !(h >= 12 && h <= 14)) key = 'label.stops_count_few';
  }
  return ui(key, '{n} stops').replace('{n}', n);
}

// ══════ GRAFIKI TRAS ══════
// Jedna grafika z Que na wycieczke, robiona lokalnie skryptem img/!build-img.py.
// Nazwa wynika ze slugow: media/tours/quolino-<kraj>-<miasto>-tile-384.webp itd.
// Zadnych zapytan do Wikipedii i zadnego cache w localStorage — pliki sa nasze,
// wiec wystarczy poprawna sciezka i przegladarkowy cache.
var IMG_DIR = 'media/tours/';

function imgBase(city) {
  if (!city) return '';
  if (city.hero_image) return IMG_DIR + city.hero_image; // nadpisanie z bazy
  if (!city.country || !city.slug) return '';
  return IMG_DIR + 'quolino-' + city.country + '-' + city.slug;
}
function showFallback(wrap, color, letter) {
  wrap.classList.remove('loading');
  if (wrap.querySelector('.city-fallback')) return;
  wrap.style.background = 'linear-gradient(135deg,' + (color || '#B4502E') + ' 0%, rgba(56,48,38,.55) 100%)';
  var d = document.createElement('div');
  d.className = 'city-fallback';
  d.textContent = (letter || '?').charAt(0).toUpperCase();
  wrap.appendChild(d);
}
function loadCityImage(wrap, city, letter) {
  var base = imgBase(city);
  var color = city ? city.bandana_color : null;
  if (!base) { showFallback(wrap, color, letter); return; }
  var img = document.createElement('img');
  img.className = 'city-img';
  img.alt = ''; img.loading = 'lazy'; img.decoding = 'async';
  img.width = 768; img.height = 768;
  img.src    = base + '-tile-384.webp';
  img.srcset = base + '-tile-384.webp 384w, ' + base + '-tile-768.webp 768w';
  img.sizes  = '(max-width:560px) 92vw, 300px';
  img.onload  = function() { wrap.classList.remove('loading'); img.classList.add('loaded'); };
  // brak pliku = jeszcze nie narysowany — wtedy gradient z litera, bez bledu w konsoli
  img.onerror = function() { img.remove(); showFallback(wrap, color, letter); };
  wrap.appendChild(img);
}

// ══════════════ LOAD PAGE ══════════════
function loadPage(lang) {
  currentLang = lang;
  savePref(lang);
  document.documentElement.lang = lang;

  if (!regionSlug) { fail('Brak parametru regionu.'); return; }

  Promise.all([
    sb('languages', 'enabled=eq.true&order=priority'),
    sb('ui_translations', 'lang=eq.' + lang),
    sb('regions', 'select=*&order=sort_order'),
    sb('region_translations', 'lang=eq.' + lang),
    sb('countries', 'select=*'),
    sb('country_translations', 'lang=eq.' + lang),
    sb('cities', 'status=eq.published&select=slug,country,region_slug,bandana_color,duration_type,duration_hours,hero_image,sort_order&order=sort_order'),
    sb('city_translations', 'lang=eq.' + lang),
    sb('stops', 'select=city_slug')
  ]).then(function(res) {
    langList        = res[0];
    var uiRows      = res[1];
    var allRegions  = res[2];
    var regionTrs   = res[3];
    var countries   = res[4];
    var countryTrs  = res[5];
    var allCities   = res[6];
    var cityTrs     = res[7];
    var allStops    = res[8];

    uiStrings = {};
    uiRows.forEach(function(r) { uiStrings[r.key] = r.value; });

    buildLangPopup();
    updateActiveLang();
    document.querySelectorAll('[data-ui]').forEach(function(el) {
      var v = uiStrings[el.getAttribute('data-ui')];
      if (v) el.textContent = v;
    });

    var region = allRegions.filter(function(r) { return r.slug === regionSlug; })[0];
    if (!region) { fail(ui('error.region_not_found', 'Nie znaleźliśmy tego regionu.')); return; }

    var rTr        = regionTrs.filter(function(t) { return t.region_slug === regionSlug; })[0];
    var regionName = rTr ? rTr.name : regionSlug;
    var country    = countries.filter(function(c) { return c.slug === region.country_slug; })[0];
    var cTr        = countryTrs.filter(function(t) { return t.country_slug === region.country_slug; })[0];
    var countryName = cTr ? cTr.name : (region.country_slug || '');
    var continent   = (country && country.continent) || 'europe';

    // stops per city
    var stopCount = {};
    allStops.forEach(function(s) { stopCount[s.city_slug] = (stopCount[s.city_slug] || 0) + 1; });

    var cities = allCities.filter(function(c) { return c.region_slug === regionSlug; });

    document.title = regionName + ' — Quolino';
    buildCrumbs(continent, countryName, regionName, region.country_slug);
    buildRegion(region, regionName, countryName, country, rTr, cities, cityTrs, stopCount,
                allRegions, regionTrs, allCities, countries, countryTrs);
  }).catch(function(err) {
    console.error('Supabase error:', err);
    fail(ui('error.load', 'Nie udało się wczytać danych. Odśwież stronę.'));
  });
}

function fail(msg) {
  document.getElementById('regionContent').innerHTML =
    '<div class="state-msg">' + esc(msg) + '<br><br><a href="./">' + esc(ui('nav.home', 'Strona główna')) + '</a></div>';
}

// ══════════════ BREADCRUMBS ══════════════
// 🏠 › Europa › Włochy › Marche
function buildCrumbs(continent, countryName, regionName, countrySlug) {
  var nav = document.getElementById('crumbs');
  if (!nav) return;
  var homeLabel = ui('nav.home', 'Strona główna');
  var html = '';

  html += '<a class="crumb-home" href="./" title="' + esc(homeLabel) + '" aria-label="' + esc(homeLabel) + '">' +
            '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>' +
          '</a>';

  var levels = [
    { label: ui('continent.' + continent, 'Europa'), href: './#regiony' },
    { label: countryName,                            href: countrySlug ? 'country.html?k=' + encodeURIComponent(countrySlug) : './#regiony' },
    { label: regionName,                             href: null }
  ];

  levels.forEach(function(l) {
    if (!l.label) return;
    html += '<span class="crumb-sep" aria-hidden="true">&rsaquo;</span>';
    html += l.href
      ? '<a href="' + l.href + '">' + esc(l.label) + '</a>'
      : '<span class="crumb-current" aria-current="page">' + esc(l.label) + '</span>';
  });

  nav.innerHTML = html;
}

// ══════════════ REGION + CITY TILES ══════════════
function buildRegion(region, regionName, countryName, country, rTr, cities, cityTrs, stopCount,
                     allRegions, regionTrs, allCities, countries, countryTrs) {
  var el = document.getElementById('regionContent');
  var flagCode = country ? country.flag_code : region.country_slug;
  var html = '';

  // ── Hero ──
  html += '<div class="region-hero">';
  html += '<div class="caps" style="font-size:14px">' + esc(countryName);
  if (flagCode) html += ' <img src="https://flagcdn.com/w40/' + flagCode + '.png" alt="" style="width:20px;height:14px;border-radius:3px;vertical-align:middle;margin-left:5px">';
  html += '</div>';
  html += '<h1 class="region-name">' + esc(regionName) + '</h1>';
  if (rTr && rTr.description) html += '<p class="region-desc">' + esc(rTr.description) + '</p>';
  html += '<div class="region-meta"><span>' + cities.length + ' ' + esc(ui('home.region_ready', 'gotowe plany')) + '</span></div>';
  html += '</div>';

  // ── City tiles ──
  html += '<div class="city-grid" id="cityGrid"></div>';

  // ── Other regions ──
  var published = {};
  allCities.forEach(function(c) { published[c.region_slug] = (published[c.region_slug] || 0) + 1; });
  var others = allRegions.filter(function(r) {
    return r.slug !== regionSlug && published[r.slug] && r.country_slug === region.country_slug;
  });

  if (others.length) {
    html += '<div class="other-regions"><p class="caps">' + esc(ui('label.other_regions_italy', 'Inne regiony')) + '</p><div class="other-region-grid">';
    others.forEach(function(reg) {
      var oTr    = regionTrs.filter(function(t) { return t.region_slug === reg.slug; })[0];
      var oName  = oTr ? oTr.name : reg.slug;
      var oCt    = countryTrs.filter(function(t) { return t.country_slug === reg.country_slug; })[0];
      var oCoun  = oCt ? oCt.name : '';
      var oFlag  = (countries.filter(function(c) { return c.slug === reg.country_slug; })[0] || {}).flag_code || reg.country_slug;
      html += '<a class="other-region-tile" href="region.html?r=' + encodeURIComponent(reg.slug) + '">';
      html += '<div style="flex:1"><div style="font-size:13px;color:var(--label)">' + esc(oCoun);
      if (oFlag) html += ' <img src="https://flagcdn.com/w40/' + oFlag + '.png" alt="" style="width:16px;height:11px;border-radius:2px;vertical-align:middle;margin-left:3px">';
      html += '</div><div style="font-size:19px;font-weight:800;letter-spacing:-.01em;margin-top:2px">' + esc(oName) + '</div>';
      html += '<div style="font-size:14px;color:var(--label);margin-top:2px">' + published[reg.slug] + ' ' + esc(ui('home.region_ready', 'gotowe plany')) + '</div></div>';
      html += '<div style="font-size:19px;color:var(--terra)">&rarr;</div></a>';
    });
    html += '</div></div>';
  }

  el.innerHTML = html;

  // Build tiles as nodes so we can attach lazy photo loading per card
  var grid = document.getElementById('cityGrid');
  cities.forEach(function(city) {
    var tr    = cityTrs.filter(function(t) { return t.city_slug === city.slug; })[0];
    var title = tr ? tr.title : city.slug;
    var sub   = tr ? tr.subtitle : '';

    var card = document.createElement('a');
    card.className = 'city-card';
    card.href = 'city.html?c=' + encodeURIComponent(city.slug);

    var wrap = document.createElement('div');
    wrap.className = 'city-img-wrap loading';
    if (city.duration_type) {
      var badgeKey = city.duration_type === 'full_day' ? 'filter.full_day' : 'filter.half_day';
      var badgeTxt = ui(badgeKey, '');
      if (badgeTxt) {
        var b = document.createElement('div');
        b.className = 'city-badge';
        b.textContent = badgeTxt;
        wrap.appendChild(b);
      }
    }
    card.appendChild(wrap);

    var body = document.createElement('div');
    body.className = 'city-body';
    var stops = stopCount[city.slug] || 0;
    body.innerHTML =
      '<div class="city-head">' +
        '<div class="city-name">' + esc(title) + '</div>' +
        (city.duration_hours ? '<div class="city-dur">' + esc(durationLabel(city.duration_hours)) + '</div>' : '') +
      '</div>' +
      (sub ? '<div class="city-sub">' + esc(sub) + '</div>' : '') +
      (stops ? '<div class="city-foot"><span class="city-accent" style="background:' + (city.bandana_color || 'var(--terra)') + '"></span><span>' + esc(stopsLabel(stops)) + '</span></div>' : '') +
      '<div class="city-go"><span>' + esc(ui('home.cta_open', 'Zaczynamy!')) + '</span><span class="arrow" aria-hidden="true">&rarr;</span></div>';
    card.appendChild(body);

    grid.appendChild(card);
    loadCityImage(wrap, city, title);
  });
}

// ══════════════ LANGUAGE POPUP ══════════════
function buildLangPopup() {
  var grid = document.getElementById('langGrid');
  if (!grid) return;
  grid.innerHTML = '';
  langList.forEach(function(l) {
    var btn = document.createElement('button');
    btn.innerHTML = '<img src="https://flagcdn.com/w40/' + (l.flag_code || l.code) + '.png" alt="">' + esc(l.name_native);
    if (l.code === currentLang) btn.classList.add('active');
    btn.addEventListener('click', function() {
      document.getElementById('langPopup').classList.remove('open');
      if (l.code !== currentLang) loadPage(l.code);
    });
    grid.appendChild(btn);
  });
}

function updateActiveLang() {
  var l = langList.filter(function(x) { return x.code === currentLang; })[0];
  var flag = (l && l.flag_code) ? l.flag_code : currentLang;
  var img = document.getElementById('activeFlagImg');
  var dimg = document.getElementById('drawerFlagImg');
  var code = document.getElementById('activeLangCode');
  if (img)  img.src  = 'https://flagcdn.com/w40/' + flag + '.png';
  if (dimg) dimg.src = 'https://flagcdn.com/w40/' + flag + '.png';
  if (code) code.textContent = currentLang.toUpperCase();
}

// ══════════════ KEYBOARD ══════════════
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    document.getElementById('langPopup').classList.remove('open');
    document.getElementById('mobileDrawer').style.display = 'none';
  }
});

// ══════════════ INIT ══════════════
loadPage(currentLang);
</script>
</body>
</html>
