<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quolino — ładowanie…</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=6">
<style>
/* ===== Stop category icons ===== */
.stop-cat{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;flex-shrink:0;margin-right:4px;vertical-align:middle}
.stop-cat svg{width:16px;height:16px}
.stop-cat--parking{background:var(--sea-bg);color:var(--sea)}.stop-cat--parking svg{stroke:var(--sea)}
.stop-cat--museum{background:#F3E8F5;color:#7B4FA2}.stop-cat--museum svg{stroke:#7B4FA2}
.stop-cat--house{background:var(--olive-bg);color:var(--olive)}.stop-cat--house svg{stroke:var(--olive)}
.stop-cat--church{background:#FDE8E0;color:var(--terra)}.stop-cat--church svg{stroke:var(--terra)}
.stop-cat--restaurant{background:#FFF3E0;color:#BF6C00}.stop-cat--restaurant svg{stroke:#BF6C00}
.stop-cat--viewpoint{background:var(--sea-bg);color:var(--sea)}.stop-cat--viewpoint svg{stroke:var(--sea)}
.stop-cat--monument{background:#E8EDF5;color:#4A6FA5}.stop-cat--monument svg{stroke:#4A6FA5}
.stop-cat--park{background:var(--olive-bg);color:var(--olive)}.stop-cat--park svg{stroke:var(--olive)}
.stop-cat--other{background:var(--chip-bg);color:var(--ink2)}.stop-cat--other svg{stroke:var(--ink2)}

/* ===== City tabs ===== */
.city-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:16px 0 4px;-webkit-overflow-scrolling:touch}
.city-tabs::-webkit-scrollbar{display:none}
.city-tab{flex-shrink:0;min-height:44px;padding:0 16px;border-radius:999px;background:var(--parchment);border:1.5px solid var(--line);color:var(--ink2);font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:border-color .12s,color .12s,background .12s}
.city-tab:hover{border-color:var(--terra);color:var(--terra-h)}
.city-tab.active{background:var(--terra);color:var(--parchment);border-color:var(--terra)}
.city-tab:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.city-tab svg{width:16px;height:16px;flex-shrink:0}
.city-tab.active svg{stroke:var(--parchment)}
body.kid-mode .city-tabs{display:none}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* ===== Loading / error states ===== */
.tpl-loading{text-align:center;padding:80px 20px;font-size:18px;color:var(--ink2)}
.tpl-error{text-align:center;padding:80px 20px;color:var(--terra)}
.tpl-error h2{font-size:24px;margin-bottom:8px}
.tpl-spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--terra);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<nav class="sticky-nav">
  <div class="sticky-nav-inner">
    <a href="./" class="logo">
      <span class="logo-name">quolino</span><span class="logo-dot">.</span><span class="logo-tld">com</span>

<!-- ==================== MOBILE DRAWER ==================== -->
<div id="mobileDrawer" style="display:none;position:fixed;inset:0;z-index:200;background:rgba(56,48,38,.4)" onclick="this.style.display='none'">
  <div style="position:absolute;top:0;left:0;right:0;background:var(--parchment);border-radius:0 0 20px 20px;box-shadow:0 8px 32px rgba(60,42,20,.18);padding:0 20px 28px" onclick="event.stopPropagation()">

      <div class="logo"><span class="logo-name">quolino</span><span class="logo-dot">.</span><span class="logo-tld">com</span></div>
      <button onclick="document.getElementById('mobileDrawer').style.display='none'" aria-label="Zamknij" style="width:48px;height:48px;border:none;cursor:pointer;border-radius:12px;background:transparent;display:grid;place-items:center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>

    <a href="./#regiony" onclick="document.getElementById('mobileDrawer').style.display='none'" style="display:flex;align-items:center;justify-content:center;height:52px;background:rgba(180,80,46,.06);border:2px solid var(--terra);border-radius:14px;font-size:18px;font-weight:700;color:var(--terra);margin-bottom:16px" data-ui="nav.regions">Wybierz region</a>

</div>

<script>
/* ============================================================
   QUOLINO — city.html template
   Vanilla JS · Supabase REST API · Zero dependencies
   ============================================================ */
(function(){
'use strict';

// ── Config ─────────────────────────────────────────────
var SB_URL  = 'https://ntwpjcupffdozstbijhh.supabase.co/rest/v1';
var SB_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50d3BqY3VwZmZkb3pzdGJpamhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMzc5MTUsImV4cCI6MjEwMjgxMzkxNX0.OddjLt-gKKmj2H7wrEKJ14CXrsXu0L4UBO2GC9OiCGo';
var FALLBACK = 'pl';

// ── State ──────────────────────────────────────────────
var citySlug = new URLSearchParams(location.search).get('c');
var currentLang = new URLSearchParams(location.search).get('lang') || readPref() || FALLBACK;
var cityData = null;   // raw city row
var langList = [];     // enabled languages
var uiStrings = {};    // ui_translations for currentLang

// ── SVG icons per stop category ────────────────────────
var CAT_ICONS = {
  parking:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 17V7h4a3.5 3.5 0 010 7H9"/></svg>',
  museum:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/></svg>',
  house:      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1z"/><path d="M9 21V14h6v7"/></svg>',
  church:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 21H6V10l6-7 6 7z"/><path d="M12 3v4M9 21v-4a3 3 0 016 0v4"/><path d="M2 10h4M18 10h4"/></svg>',
  restaurant: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 010 8h-1"/><path d="M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>',
  viewpoint:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',
  monument:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h20M5 20V8l7-5 7 5v12"/><rect x="9" y="12" width="6" height="8"/></svg>',
  park:       '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V8"/><path d="M5 12s2-7 7-7 7 7 7 7"/><path d="M3 22h18"/></svg>',
  castle:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V8l3 2V6l3 2V6l3-2 3 2v2l3-2v4l3-2v13z"/><path d="M10 21v-5h4v5"/></svg>',
  street:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22 9 2M20 22 15 2"/><path d="M12 6v3M12 13v3M12 20v1"/></svg>',
  icecream:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11a4 4 0 1 1 8 0"/><path d="M7 11h10l-5 10z"/></svg>',
  sweets:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><path d="M5 20v-6a7 7 0 0 1 14 0v6"/><path d="M12 7V4"/></svg>',
  photo:      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  synagogue:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 8 5v13H4V8z"/><path d="m12 10 2.6 4.5h-5.2z"/><path d="m12 19-2.6-4.5h5.2z"/></svg>',
};

var TAB_ICONS = {
  emergency: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><circle cx="12" cy="17" r=".5" fill="currentColor"/><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>',
  phrases:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>',
  phones:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.86 19.86 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.86 19.86 0 012.12 4.18 2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.362 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>',
  qr:        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v3h-3M14 20h3M20 20h0"/></svg>',
};

var NAV_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>';

// ── Supabase fetch helper ──────────────────────────────
function sb(table, params) {
  var url = SB_URL + '/' + table;
  if (params) url += '?' + params;
  return fetch(url, {
    headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
  }).then(function(r) {
    if (!r.ok) throw new Error(r.status + ' ' + table);
    return r.json();
  });
}

// ── Language prefs ─────────────────────────────────────
function readPref()  { try { return localStorage.getItem('quolino_lang'); } catch(e) { return null; } }
function savePref(l) { try { localStorage.setItem('quolino_lang', l); } catch(e) {} }

// ── HTML escape ────────────────────────────────────────
function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ── Get UI string ──────────────────────────────────────
function ui(key, fallback) { return uiStrings[key] || fallback || key; }

// ── Duration label ─────────────────────────────────────
function durationLabel(city) {
  if (city.duration_type === 'full_day') return ui('label.full_day', 'cały dzień');
  return ui('label.half_day', 'pół dnia');
}

// ── Build page ─────────────────────────────────────────
function loadPage(lang) {
  if (!citySlug) { showError('Brak parametru ?c= w adresie.'); return; }
  currentLang = lang;
  savePref(lang);

  // Fetch all data in parallel
  Promise.all([
    sb('cities', 'slug=eq.' + citySlug + '&select=*'),
    sb('city_translations', 'city_slug=eq.' + citySlug + '&lang=eq.' + lang),
    sb('stops', 'city_slug=eq.' + citySlug + '&select=*,stop_translations(*)&order=sort_order'),
    sb('day_plan', 'city_slug=eq.' + citySlug + '&lang=eq.' + lang + '&order=sort_order'),
    sb('emergency_points', 'city_slug=eq.' + citySlug + '&lang=eq.' + lang + '&order=sort_order'),
    sb('languages', 'enabled=eq.true&order=priority'),
    sb('ui_translations', 'lang=eq.' + lang),
    sb('regions', 'select=slug,country_slug'),
    sb('region_translations', 'lang=eq.' + lang),
    sb('country_translations', 'lang=eq.' + lang),
    sb('phrases', 'lang=eq.' + lang + '&order=sort_order'),
    sb('phone_numbers', 'order=sort_order'),
    sb('countries', 'select=*'),
  ]).then(function(results) {
    var city       = results[0][0];
    var cityTr     = results[1][0] || {};
    var stops      = results[2];
    var dayPlan    = results[3];
    var emergency  = results[4];
    langList       = results[5];
    var uiRows     = results[6];
    var regions    = results[7];
    var regionTrs  = results[8];
    var countryTrs = results[9];
    var allPhrases = results[10];
    var phones     = results[11];
    var countries  = results[12];

    if (!city) { showError('Nie znaleziono wycieczki: ' + esc(citySlug)); return; }
    cityData = city;

    // Build UI strings map
    uiStrings = {};
    uiRows.forEach(function(r) { uiStrings[r.key] = r.value; });

    // Find region/country names
    var region = regions.find(function(r) { return r.slug === city.region_slug; }) || {};
    var regionName = '';
    var regionTr = regionTrs.find(function(r) { return r.region_slug === city.region_slug; });
    if (regionTr) regionName = regionTr.name;

    var countryName = '';
    var countryTr = countryTrs.find(function(r) { return r.country_slug === city.country; });
    if (countryTr) countryName = countryTr.name;

    var countryRow = countries.find(function(c) { return c.slug === city.country; }) || {};
    var continent  = countryRow.continent || 'europe';

    // Process stops: pick translation for current lang, fallback to pl
    var processedStops = stops.map(function(s) {
      var tr = null;
      if (s.stop_translations && s.stop_translations.length) {
        tr = s.stop_translations.find(function(t) { return t.lang === lang; })
          || s.stop_translations.find(function(t) { return t.lang === FALLBACK; })
          || s.stop_translations[0];
      }
      return { stop: s, tr: tr };
    });

    // Filter phrases & phones for this city's country
    var phrases = allPhrases.filter(function(p) { return p.country === city.country; });
    var cityPhones = phones.filter(function(p) { return p.country_slug === city.country; });

    // Set <title>
    document.title = (cityTr.title || city.slug) + ' — Quolino';
    document.documentElement.lang = lang;
    if (city.bandana_color) {
      document.body.dataset.city = city.slug;
      document.body.dataset.country = city.country;
    }

    // Render
    render({
      city: city,
      cityTr: cityTr,
      stops: processedStops,
      dayPlan: dayPlan,
      emergency: emergency,
      phrases: phrases,
      phones: cityPhones,
      regionName: regionName,
      countryName: countryName,
      continent: continent,
    });

    // Build language popup
    buildLangPopup();
    updateActiveLang();

  }).catch(function(err) {
    console.error('[city.html]', err);
    showError('Błąd ładowania danych. Spróbuj odświeżyć stronę.');
  });
}

// ── Render main content ────────────────────────────────
function render(d) {
  var city = d.city, tr = d.cityTr, stops = d.stops;
  var num = function(n) { return String(n).padStart(2, '0'); };
  var html = '';

  // Breadcrumb: 🏠 › Europa › Włochy › Marche › Urbino
  var homeLabel = ui('nav.home', 'Strona główna');
  html += '<nav class="crumbs" aria-label="Breadcrumb">';
  html += '<a class="crumb-home" href="./" title="' + esc(homeLabel) + '" aria-label="' + esc(homeLabel) + '">' +
            '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg></a>';

  var levels = [
    { label: ui('continent.' + (d.continent || 'europe'), 'Europa'), href: './#regiony' },
    { label: d.countryName, href: city.country ? 'country.html?k=' + encodeURIComponent(city.country) : './#regiony' },
    { label: d.regionName,  href: city.region_slug ? 'region.html?r=' + encodeURIComponent(city.region_slug) : null },
    { label: tr.title || city.slug, href: null }
  ];
  levels.forEach(function(l) {
    if (!l.label) return;
    html += '<span class="crumb-sep" aria-hidden="true">&rsaquo;</span>';
    html += l.href
      ? '<a href="' + l.href + '">' + esc(l.label) + '</a>'
      : '<span class="crumb-current" aria-current="page">' + esc(l.label) + '</span>';
  });
  html += '</nav>';

  // Hero image — grafika 16:9 z Que; gradient pod spodem gra role zapasu,
  // wiec miasto bez narysowanej grafiki nie wyglada na zepsute.
  var imgBase = city.hero_image
    ? city.hero_image
    : (city.country && city.slug ? 'media/tours/' + city.country + '-' + city.slug : '');
  html += '<div class="hero-img" style="background:linear-gradient(135deg,' +
          (city.bandana_color || '#B4502E') + ' 0%, rgba(56,48,38,.55) 100%)">';
  if (imgBase) {
    html += '<img src="' + esc(imgBase) + '-hero-800.webp"' +
            ' srcset="' + esc(imgBase) + '-hero-480.webp 480w, ' +
                          esc(imgBase) + '-hero-800.webp 800w, ' +
                          esc(imgBase) + '-hero-1200.webp 1200w"' +
            ' sizes="(max-width:900px) 100vw, 900px"' +
            ' width="1200" height="675" alt="" decoding="async"' +
            ' onerror="this.remove()">';
  }
  html += '<div class="hero-over"><div></div>';
  html += '<button class="kid-toggle" onclick="toggleKidView()" aria-pressed="false">👁 <span>' + ui('btn.kid_view', 'Widok dziecka') + '</span></button>';
  html += '</div></div>';

  // Hero body
  html += '<div class="city-hero-body">';
  html += '<p class="caps">' + esc(tr.region_label || d.regionName || '') + ' · ' + durationLabel(city) + '</p>';
  html += '<h1>' + esc(tr.title || city.slug) + '</h1>';
  if (tr.subtitle) html += '<p class="subtitle">' + esc(tr.subtitle) + '</p>';
  if (tr.hero_note) html += '<p class="stop-note" style="margin-top:4px">' + esc(tr.hero_note) + '</p>';
  // Zweryfikowana trasa calego dnia — jeden link zamiast jedenastu nawigacji
  if (city.route_url) {
    html += '<div class="route-all">' +
              '<a class="act act-pri" href="' + esc(city.route_url) + '" target="_blank" rel="noopener">' +
                NAV_ICON + '<span>' + esc(ui('btn.route_all', 'Cała trasa w Google Maps')) + '</span></a>' +
            '</div>';
  }
  html += '</div>';

  // Wstep — akapity rozdzielone pustym wierszem ida jako osobne akapity
  if (tr.lead) {
    html += '<div class="city-lead-block">';
    String(tr.lead).split(/\n\s*\n/).forEach(function(par) {
      if (par.trim()) html += '<p class="city-lead">' + esc(par.trim()) + '</p>';
    });
    html += '</div>';
  }

  // Legenda ikon — tylko kategorie, ktore w tym miescie wystepuja
  var uzyte = [];
  stops.forEach(function(item) {
    var c = item.stop.category;
    if (c && uzyte.indexOf(c) === -1) uzyte.push(c);
  });
  if (uzyte.length) {
    html += '<div class="legend" data-hide-kid><p class="caps">' + esc(ui('label.icons_legend', 'Ikony trasy')) + '</p><div class="legend-items">';
    uzyte.forEach(function(c) {
      html += '<span class="legend-item"><span class="stop-cat stop-cat--' + c + '">' +
              (CAT_ICONS[c] || CAT_ICONS.monument) + '</span>' +
              esc(ui('cat.' + c, c)) + '</span>';
    });
    html += '</div></div>';
  }

  // Trasa jest rama, nie klatka (WYTYCZNE §15) — to samo zdanie przy kazdym miescie
  html += '<div class="box box-flex" data-hide-kid><p class="caps">' +
          esc(ui('label.flexible_route', 'Elastyczna trasa')) + '</p><p>' +
          esc(ui('text.flexible_route', 'Każdy punkt może być obowiązkowy albo opcjonalny. Możecie pominąć przystanek, zmienić kolejność, skrócić pobyt albo dodać własny. Numer punktu to podpowiedź, nie harmonogram.')) +
          '</p></div>';

  // Tabs
  html += '<nav class="city-tabs" id="cityTabs" aria-label="Sekcje" data-hide-kid>';
  html += tabBtn('punkty-awaryjne', TAB_ICONS.emergency, ui('label.emergency', 'Punkty awaryjne'), true);
  html += tabBtn('rozmowki', TAB_ICONS.phrases, ui('label.phrases', 'Rozmówki'), false);
  html += tabBtn('telefony', TAB_ICONS.phones, ui('label.phones', 'Telefony'), false);
  html += tabBtn('qr-dziecka', TAB_ICONS.qr, ui('label.qr_kid', 'QR dla dziecka'), false);
  html += '</nav>';

  // Stops
  html += '<div class="stops" id="stops">';
  stops.forEach(function(item) {
    var s = item.stop, t = item.tr || {};
    var id = num(s.stop_number);
    var cat = s.category || 'other';
    var catClass = 'stop-cat stop-cat--' + cat;
    var icon = CAT_ICONS[cat] || CAT_ICONS.monument;

    html += '<div class="stop open" data-id="' + id + '"' +
            (s.stop_key ? ' id="' + esc(s.stop_key) + '"' : '') + '>';
    html += '<button class="stop-header" onclick="toggleStop(\'' + id + '\')">';

    // Row 1: icon + number + name
    html += '<div class="stop-row1">';
    html += '<span class="' + catClass + '">' + icon + '</span>';
    html += '<span class="stop-num">' + id + (s.time_label ? ' · ' + esc(s.time_label) : '') + '</span>';
    html += '<span class="stop-name">' + esc(t.name || 'Przystanek ' + id) + '</span>';
    html += '<span class="stop-chev">▼</span>';
    html += '</div>';

    // Chips
    // Cena i godziny NIGDY nie udaja pewnosci: jesli status mowi 'unverified',
    // plakietka sama sie do tego przyznaje (WYTYCZNE §3).
    var doSprawdzenia = esc(ui('label.unverified', 'do sprawdzenia'));
    var chips = [];
    if (s.year_built) chips.push('<span class="chip-sm chip-neutral">' + esc(s.year_built) + '</span>');
    if (s.visit_duration) chips.push('<span class="chip-sm chip-neutral">&#9201; ' + esc(s.visit_duration) + '</span>');
    if (s.opening_hours) {
      chips.push('<span class="chip-sm chip-neutral">&#128336; ' + esc(s.opening_hours) +
                 (s.hours_status === 'unverified' ? ' &middot; ' + doSprawdzenia : '') + '</span>');
    }
    if (s.price) {
      chips.push('<span class="chip-sm chip-olive">' + esc(s.price) +
                 (s.price_status === 'unverified' ? ' &middot; ' + doSprawdzenia : '') + '</span>');
    }
    if (s.rating) {
      chips.push('<span class="chip-sm chip-neutral">&#9733; ' + esc(String(s.rating).replace('.', ',')) +
                 (s.reviews_count ? ' &middot; ' + s.reviews_count : '') + '</span>');
    }
    if (s.optional)    chips.push('<span class="chip-sm chip-sea">' + esc(ui('label.optional', 'opcjonalnie')) + '</span>');
    if (s.sunset_spot) chips.push('<span class="chip-sm chip-sea">&#127751; ' + esc(ui('label.sunset', 'na zachód słońca')) + '</span>');
    if (chips.length) html += '<div class="stop-chips">' + chips.join('') + '</div>';

    // Actions
    var akcje = [];
    if (s.maps_query) {
      akcje.push('<a class="act act-pri" href="https://www.google.com/maps/search/?api=1&query=' +
                 encodeURIComponent(s.maps_query) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">' +
                 NAV_ICON + '<span>' + esc(ui('btn.navigate', 'Nawiguj')) + '</span></a>');
    }
    if (s.whatsapp) {
      akcje.push('<a class="act act-sec" href="https://wa.me/' + encodeURIComponent(String(s.whatsapp).replace(/[^0-9]/g, '')) +
                 '" target="_blank" rel="noopener" onclick="event.stopPropagation()"><span>' +
                 esc(ui(s.reservation === 'required' || s.reservation === 'recommended' ? 'btn.reserve' : 'btn.write',
                        s.reservation ? 'Rezerwuj' : 'Napisz')) + '</span></a>');
    }
    if (s.website) {
      akcje.push('<a class="act act-sec" href="' + esc(s.website) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()"><span>' +
                 esc(ui('btn.www', 'WWW')) + '</span></a>');
    }
    // §3: przy kazdym punkcie ma byc czym sprawdzic dane samodzielnie
    if (s.verify_url) {
      akcje.push('<a class="act act-sec" href="' + esc(s.verify_url) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()"><span>' +
                 esc(ui('btn.verify', 'Sprawdź')) + '</span></a>');
    }
    if (akcje.length) html += '<div class="stop-actions">' + akcje.join('') + '</div>';

    html += '</button>';

    // Stop body
    html += '<div class="stop-body">';
    if (s.hero_image) {
      html += '<div class="stop-photo" style="background-image:url(' + esc(s.hero_image) + ')"></div>';
    }

    if (t.desc_paragraphs && t.desc_paragraphs.length) {
      t.desc_paragraphs.forEach(function(p) {
        html += '<p class="stop-desc">' + esc(p) + '</p>';
      });
    }

    if (t.kids_box) {
      html += '<div class="box box-kids"><p class="caps">' + ui('label.for_kids', 'Dla dzieci') + '</p><p>' + esc(t.kids_box) + '</p></div>';
    }
    // D · Wskazówka — zaraz pod questem, bo ma pomóc go rozwiązać
    if (t.hint) {
      html += '<div class="box box-hint"><p class="caps">' + ui('label.hint', 'Wskazówka') + '</p><p>' + esc(t.hint) + '</p></div>';
    }
    if (t.photo_task) {
      html += '<div class="box box-foto"><p class="caps">' + ui('label.photo_task', 'Zadanie foto') + '</p><p>' + esc(t.photo_task) + '</p></div>';
    }
    // E · Lokalny smak — legenda/anegdota dla rodzica
    if (t.local_flavor) {
      html += '<div class="box box-local"><p class="caps">' + ui('label.local_flavor', 'Lokalny smak') + '</p><p>' + esc(t.local_flavor) + '</p></div>';
    }
    if (t.practical_note) {
      html += '<div class="box box-practical"><p class="caps">' + esc(ui('label.practical', 'Praktycznie')) + '</p><p>' + esc(t.practical_note) + '</p></div>';
    }
    // Stroj pokazujemy tylko wtedy, gdy naprawde jest wymog — puste pole znaczy „bez wymogow"
    if (t.dress_code) {
      html += '<div class="box box-dress"><p class="caps">' + esc(ui('label.dress_code', 'Strój')) + '</p><p>' + esc(t.dress_code) + '</p></div>';
    }

    html += '</div></div>';
  });
  html += '</div>';

  // Day plan
  if (d.dayPlan && d.dayPlan.length) {
    html += '<div class="foot-section">';
    html += '<p class="caps">' + ui('label.day_plan', 'Plan dnia') + '</p>';
    html += '<div class="plan-card">';
    d.dayPlan.forEach(function(row) {
      html += '<div class="plan-row"><span class="plan-time">' + esc(row.time_label) + '</span><span>' + esc(row.description) + '</span></div>';
    });
    html += '</div></div>';
  }

  // Lokalne jedzenie
  if (tr.local_food) {
    html += '<div class="foot-section">';
    html += '<p class="caps">' + esc(ui('label.local_food', 'Lokalne jedzenie')) + '</p>';
    html += '<p class="note" style="margin-top:0">' + esc(tr.local_food) + '</p>';
    html += '</div>';
  }

  // Good to know
  if (tr.good_to_know) {
    html += '<div class="foot-section">';
    html += '<p class="caps">' + ui('label.good_to_know', 'Warto wiedzieć') + '</p>';
    html += '<p class="note" style="margin-top:0">' + esc(tr.good_to_know) + '</p>';
    html += '</div>';
  }

  // Tab panels
  // Emergency
  html += '<div class="tab-panel active" id="punkty-awaryjne">';
  html += '<div class="foot-section" style="margin-top:0">';
  html += '<p class="caps">' + ui('label.emergency', 'Punkty awaryjne') + '</p>';
  if (d.emergency && d.emergency.length) {
    d.emergency.forEach(function(e) {
      html += '<div class="info-row">';
      html += '<div class="info-row-text"><strong>' + esc(e.label) + '</strong> ' + esc(e.description) + '</div>';
      if (e.maps_query) {
        html += '<a class="info-nav" href="https://maps.google.com/?q=' + encodeURIComponent(e.maps_query) + '" target="_blank" rel="noopener">' + NAV_ICON + '<span>' + ui('btn.navigate', 'Nawiguj') + '</span></a>';
      }
      html += '</div>';
    });
  } else {
    html += '<p class="note">' + ui('label.no_data', 'Dane wkrótce.') + '</p>';
  }
  html += '</div></div>';

  // Phrases
  html += '<div class="tab-panel" id="rozmowki">';
  html += '<div class="foot-section" style="margin-top:0">';
  html += '<p class="caps">' + ui('label.phrases', 'Rozmówki') + '</p>';
  if (d.phrases && d.phrases.length) {
    html += '<div class="phrase-card">';
    d.phrases.forEach(function(p) {
      html += '<div class="phrase-pair"><div class="phrase-pl">' + esc(p.phrase_user) + '</div><div class="phrase-it">' + esc(p.phrase_local) + '</div></div>';
    });
    html += '</div>';
  } else {
    html += '<p class="note">' + ui('label.no_data', 'Dane wkrótce.') + '</p>';
  }
  html += '</div></div>';

  // Phones
  html += '<div class="tab-panel" id="telefony">';
  html += '<div class="foot-section" style="margin-top:0">';
  html += '<p class="caps">' + ui('label.phones', 'Telefony') + '</p>';
  if (d.phones && d.phones.length) {
    d.phones.forEach(function(p) {
      html += '<div class="tel-row"><span>' + esc(p.label) + '</span><a href="tel:' + esc(p.number.replace(/\s/g,'')) + '">' + esc(p.number) + '</a></div>';
    });
  } else {
    html += '<p class="note">' + ui('label.no_data', 'Dane wkrótce.') + '</p>';
  }
  html += '</div></div>';

  // QR
  html += '<div class="tab-panel" id="qr-dziecka">';
  html += '<div class="foot-section" style="margin-top:0">';
  html += '<p class="caps">' + ui('label.qr_kid', 'QR dla dziecka') + '</p>';
  html += '<div class="qr-share"><div class="qr-share-code" id="qrCode"></div>';
  html += '<div class="qr-share-text"><p>' + ui('qr.scan_text', 'Zeskanuj telefonem dziecka — otworzy się ten sam przewodnik w widoku dziecka.') + '</p>';
  html += '<a class="qr-share-link" href="#" id="qrLink"></a></div></div>';
  html += '</div></div>';

  // Inject
  document.getElementById('mainContent').innerHTML = html;

  // Init tabs
  initTabs();
}

// ── Tab button helper ──────────────────────────────────
function tabBtn(id, icon, label, active) {
  return '<button class="city-tab' + (active ? ' active' : '') + '" data-tab="' + id + '">' + icon + '<span>' + esc(label) + '</span></button>';
}

// ── Init tabs ──────────────────────────────────────────
function initTabs() {
  var tabs = document.querySelectorAll('.city-tab[data-tab]');
  tabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      tabs.forEach(function(t) { t.classList.remove('active'); });
      document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
      tab.classList.add('active');
      var panel = document.getElementById(tab.getAttribute('data-tab'));
      if (panel) panel.classList.add('active');
    });
  });
}

// ── Build language popup grid ──────────────────────────
function buildLangPopup() {
  var grid = document.getElementById('langGrid');
  if (!grid) return;
  grid.innerHTML = '';

  langList.forEach(function(l) {
    var btn = document.createElement('button');
    var flag = l.flag_code || l.code;
    btn.innerHTML = '<img src="https://flagcdn.com/w40/' + flag + '.png" alt="">' + esc(l.name_native);
    if (l.code === currentLang) btn.classList.add('active');
    btn.addEventListener('click', function() {
      switchLang(l.code, flag);
    });
    grid.appendChild(btn);
  });
}

// ── Switch language ────────────────────────────────────
function switchLang(lang, flagCode) {
  document.getElementById('langPopup').classList.remove('open');
  if (lang === currentLang) return;
  loadPage(lang);
}

// ── Update active language indicator ───────────────────
function updateActiveLang() {
  var lang = langList.find(function(l) { return l.code === currentLang; });
  var flag = lang && lang.flag_code ? lang.flag_code : currentLang;
  var img = document.getElementById('activeFlagImg');
  var code = document.getElementById('activeLangCode');
  if (img) img.src = 'https://flagcdn.com/w40/' + flag + '.png';
  if (code) code.textContent = currentLang.toUpperCase();
}

// ── Error/loading states ───────────────────────────────
function showError(msg) {
  document.getElementById('mainContent').innerHTML = '<div class="tpl-error"><h2>Ups!</h2><p>' + esc(msg) + '</p><p><a href="./">← Wróć na stronę główną</a></p></div>';
}

// ── Global: toggle stop accordion ──────────────────────
window.toggleStop = function(id) {
  document.querySelectorAll('.stop').forEach(function(s) {
    if (s.dataset.id === id) s.classList.toggle('open');
    else s.classList.remove('open');
  });
};

// ── Global: kid view toggle ────────────────────────────
window.toggleKidView = function() {
  document.body.classList.toggle('kid-mode');
  var btn = document.querySelector('.kid-toggle');
  if (btn) {
    var pressed = document.body.classList.contains('kid-mode');
    btn.setAttribute('aria-pressed', pressed ? 'true' : 'false');
  }
};

// ── Keyboard: Escape closes popups ─────────────────────
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    document.getElementById('langPopup').classList.remove('open');
    document.getElementById('mobileDrawer').style.display = 'none';
  }
});

// ── Init ───────────────────────────────────────────────
loadPage(currentLang);

})();
</script>
</body>
</html>
