// Build icon HTML — large 112px container with Que image + SVG fallback
function ikonaQc(cat, num) {
  var svg = CAT_SVGS[cat] || CAT_SVGS.monument;
  var plik = QUE_IKONY[cat];
  var img = plik
    ? '<img src="' + QUE_DIR + 'icon-' + plik + '-256.webp" alt=""' +
      ' width="256" height="256" loading="lazy" decoding="async"' +
      ' onload="this.parentNode.classList.add(\'has-img\')" onerror="this.remove()">'
    : '';
  return '<span class="qc-icon">' + img + svg +
         '<span class="qc-icon__no">' + num + '</span></span>';
}

// Small inline icon for plan dnia rows (32px)
function ikonaMala(cat) {
  var plik = QUE_IKONY[cat];
  if (!plik) return '';
  return '<span class="qc-row__icon"><img src="' + QUE_DIR + 'icon-' + plik + '-128.webp" alt="" width="128" height="128" loading="lazy" decoding="async" onerror="this.parentNode.style.display=\'none\'"></span>';
}

var NAV_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>';

// ── Supabase fetch helper ──────────────────────────────
function sb(table, params) {
  var url = SB_URL + '/' + table;
  if (params) url += '?' + params;
  return fetch(url, {
    headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
  }).then(function(r) {
    if (!r.ok) throw new Error(r.status + ' ' + table);
    return r.json();
  });
}

// ── Language prefs ─────────────────────────────────────
function readPref()  { try { return localStorage.getItem('quolino_lang'); } catch(e) { return null; } }
function savePref(l) { try { localStorage.setItem('quolino_lang', l); } catch(e) {} }

// ── HTML escape ────────────────────────────────────────
function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ── Get UI string ──────────────────────────────────────
function ui(key, fallback) { return uiStrings[key] || fallback || key; }

// ── Duration label ─────────────────────────────────────
function durationLabel(city) {
  if (city.duration_type === 'full_day') return ui('label.full_day', 'cały dzień');
  return ui('label.half_day', 'pół dnia');
}

// ── Build page ─────────────────────────────────────────
function loadPage(lang) {
  if (!citySlug) { showError('Brak parametru ?c= w adresie.'); return; }
  currentLang = lang;
  savePref(lang);

  Promise.all([
    sb('cities', 'slug=eq.' + citySlug + '&select=*'),
    sb('city_translations', 'city_slug=eq.' + citySlug + '&lang=in.(' + lang + ',' + FALLBACK + ')'),
    sb('stops', 'city_slug=eq.' + citySlug + '&select=*,stop_translations(*)&order=sort_order'),
    sb('day_plan', 'city_slug=eq.' + citySlug + '&lang=eq.' + lang + '&order=sort_order'),
    sb('emergency_points', 'city_slug=eq.' + citySlug + '&lang=eq.' + lang + '&order=sort_order'),
    sb('languages', 'enabled=eq.true&order=priority'),
    sb('ui_translations', 'lang=eq.' + lang),
    sb('regions', 'select=slug,country_slug'),
    sb('region_translations', 'lang=eq.' + lang),
    sb('country_translations', 'lang=eq.' + lang),
    sb('phone_numbers', 'order=sort_order'),
    sb('countries', 'select=*'),
  ]).then(function(results) {
    var city       = results[0][0];
    var cityTrRows = results[1];
    var cityTr     = cityTrRows.filter(function(r) { return r.lang === lang; })[0]
                  || cityTrRows.filter(function(r) { return r.lang === FALLBACK; })[0]
                  || cityTrRows[0] || {};
    var stops      = results[2];
    var dayPlan    = results[3];
    var emergency  = results[4];
    langList       = results[5];
    var uiRows     = results[6];
    var regions    = results[7];
    var regionTrs  = results[8];
    var countryTrs = results[9];
    var phones     = results[10];
    var countries  = results[11];

    if (!city) { showError('Nie znaleziono wycieczki: ' + esc(citySlug)); return; }
    cityData = city;

    uiStrings = {};
    uiRows.forEach(function(r) { uiStrings[r.key] = r.value; });

    var region = regions.find(function(r) { return r.slug === city.region_slug; }) || {};
    var regionName = '';
    var regionTr = regionTrs.find(function(r) { return r.region_slug === city.region_slug; });
    if (regionTr) regionName = regionTr.name;

    var countryName = '';
    var countryTr = countryTrs.find(function(r) { return r.country_slug === city.country; });
    if (countryTr) countryName = countryTr.name;

    var countryRow = countries.find(function(c) { return c.slug === city.country; }) || {};
    var continent  = countryRow.continent || 'europe';

    var processedStops = stops.map(function(s) {
      var tr = null;
      if (s.stop_translations && s.stop_translations.length) {
        tr = s.stop_translations.find(function(t) { return t.lang === lang; })
          || s.stop_translations.find(function(t) { return t.lang === FALLBACK; })
          || s.stop_translations[0];
      }
      return { stop: s, tr: tr };
    });

    var cityPhones = phones.filter(function(p) { return p.country_slug === city.country; });

    // SEO title
    var seoTitle = (cityTr.title || city.slug) + ' ' + ui('seo.with_kids', 'z dziećmi') +
                   ' — ' + ui('seo.trip_plan', 'plan wycieczki') + ' | Quolino';
    document.title = seoTitle;
    ustawMeta(city, cityTr, processedStops);
    document.documentElement.lang = lang;

    render({
      city: city, cityTr: cityTr, stops: processedStops, dayPlan: dayPlan,
      emergency: emergency, phones: cityPhones,
      regionName: regionName, countryName: countryName, continent: continent,
    });

    buildLangPopup();
    updateActiveLang();
    initTabs();
    initTaskCheckboxes();
    generateKidQR();
    applyKidViewParam();

  }).catch(function(err) {
    console.error('[city.html]', err);
    showError('Błąd ładowania danych. Spróbuj odświeżyć stronę.');
  });
}

// ── Render ─────────────────────────────────────────────
function render(d) {
  var city = d.city, tr = d.cityTr, stops = d.stops;
  var num = function(n) { return String(n).padStart(2, '0'); };
  var html = '';

  // ── Breadcrumb ──
  var homeLabel = ui('nav.home', 'Strona główna');
  html += '<nav class="qc-crumbs" aria-label="Breadcrumb">';
  html += '<a href="./" title="' + esc(homeLabel) + '">' +
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg> Quolino</a>';

  var levels = [
    { label: ui('continent.' + (d.continent || 'europe'), 'Europa'), href: './#regiony' },
    { label: d.countryName, href: city.country ? 'country.html?k=' + encodeURIComponent(city.country) : null },
    { label: d.regionName,  href: city.region_slug ? 'region.html?r=' + encodeURIComponent(city.region_slug) : null },
    { label: tr.title || city.slug, href: null }
  ];
  levels.forEach(function(l) {
    if (!l.label) return;
    html += '<span aria-hidden="true">/</span>';
    html += l.href
      ? '<a href="' + l.href + '">' + esc(l.label) + '</a>'
      : '<span aria-current="page">' + esc(l.label) + '</span>';
  });
  html += '</nav>';

  // ── Intro ──
  html += '<section class="qc-intro">';
  html += '<div class="qc-intro__text">';
  html += '<p class="qc-eyebrow">' + esc(d.regionName || '') + ' · ' + durationLabel(city) + '</p>';
  html += '<h1 class="qc-title">' + esc(tr.title || city.slug) + '</h1>';
  if (tr.subtitle) html += '<p class="qc-lede">' + esc(tr.subtitle) + '</p>';
  html += '<p class="qc-facts">';
  html += '<span>' + ui('label.stops_count', '{n} przystanków').replace('{n}', '<strong>' + stops.length + '</strong>') + '</span>';
  if (city.duration_hours) html += '<span><strong>~' + city.duration_hours + ' h</strong> ' + ui('label.route', 'trasy') + '</span>';
  if (city.start_time && city.end_time) html += '<span><strong>' + esc(city.start_time) + ' → ' + esc(city.end_time) + '</strong></span>';
  if (city.walk_km) html += '<span><strong>' + esc(String(city.walk_km).replace('.', ',')) + ' km</strong> ' + ui('label.on_foot', 'pieszo') + (city.climb_m ? ' · ' + city.climb_m + ' m ' + ui('label.uphill', 'w górę') : '') + '</span>';
  html += '</p>';
  html += '</div>';
  html += '<div class="qc-intro__actions">';
  html += '<button class="qc-btn qc-btn--ghost" type="button" id="qcKidToggle" aria-pressed="false">&#128065; ' + ui('btn.kid_view', 'Widok dziecka') + '</button>';
  if (city.route_url) {
    html += '<a class="qc-btn qc-btn--primary" href="' + esc(city.route_url) + '" target="_blank" rel="noopener">' + NAV_ICON + ' ' + esc(ui('btn.route_all', 'Cała trasa w Google Maps')) + '</a>';
  } else if (stops.length && stops[0].stop.maps_query) {
    html += '<a class="qc-btn qc-btn--primary" href="https://www.google.com/maps/search/?api=1&query=' +
            encodeURIComponent(stops[0].stop.maps_query) + '" target="_blank" rel="noopener">' + NAV_ICON + ' ' + esc(ui('btn.navigate_start', 'Prowadź do startu')) + '</a>';
  }
  html += '</div>';
  html += '</section>';

  // ── Hero image ──
  var imgBase = city.hero_image
    ? 'media/tours/' + city.hero_image
    : (city.country && city.slug ? 'media/tours/quolino-' + city.country + '-' + city.slug : '');
  if (imgBase) {
    html += '<figure class="qc-hero">';
    html += '<img src="' + esc(imgBase) + '-hero-800.webp"' +
            ' srcset="' + esc(imgBase) + '-hero-480.webp 480w, ' +
                          esc(imgBase) + '-hero-800.webp 800w, ' +
                          esc(imgBase) + '-hero-1200.webp 1200w"' +
            ' sizes="(max-width:900px) 100vw, 900px"' +
            ' width="1200" height="675"' +
            ' alt="' + esc(tr.title || city.slug) + '"' +
            ' decoding="async" onerror="this.parentNode.style.display=\'none\'">';
    html += '</figure>';
  }

  // ── Sticky tabs ──
  html += '<nav class="qc-tabs" aria-label="Sekcje">';
  html += '<a class="qc-tab" href="#trasa" aria-current="true">' + ui('tab.route', 'Trasa') + '</a>';
  html += '<a class="qc-tab" href="#plan">' + ui('tab.plan', 'Plan dnia') + '</a>';
  html += '<a class="qc-tab" href="#awaryjne">' + ui('tab.emergency', 'Punkty awaryjne') + '</a>';
  html += '<a class="qc-tab" href="#telefony">' + ui('tab.phones', 'Telefony') + '</a>';
  html += '<a class="qc-tab" href="#qr">' + ui('tab.qr', 'QR dla dziecka') + '</a>';
  html += '<a class="qc-tab qc-tab--support" href="https://buymeacoffee.com/questini" target="_blank" rel="noopener">☕ ' + ui('nav.support', 'Wesprzyj') + '</a>';
  html += '</nav>';

  // Kategoria po kluczu — do ikon w plan dnia
  var katPoKluczu = {};
  stops.forEach(function(item) {
    if (item.stop.stop_key) katPoKluczu[item.stop.stop_key] = item.stop.category;
  });

  // ── Two-column layout ──
  html += '<div class="qc-layout">';
  html += '<div class="qc-main">';

  // ═══ TRASA ═══
  html += '<section class="qc-stops" id="trasa">';
  stops.forEach(function(item, idx) {
    var s = item.stop, t = item.tr || {};
    var id = num(s.stop_number);
    var cat = s.category || 'monument';
    var isDinner = s.variant === 'dinner' || (idx === stops.length - 1 && (cat === 'restaurant' || cat === 'icecream'));
    var openAttr = idx === 0 ? ' open' : '';

    html += '<details class="qc-stop' + (isDinner ? ' qc-stop--dinner' : '') + '" data-stop-num="' + s.stop_number + '"' + openAttr + '>';
    html += '<summary class="qc-stop__head">';
    // Parent toggle switch (visible only in parent view)
    html += '<label class="qc-stop-toggle" onclick="event.stopPropagation()" title="' + esc(ui('btn.toggle_stop', 'Włącz/wyłącz dla dziecka')) + '">';
    html += '<input type="checkbox" checked data-toggle-stop="' + s.stop_number + '" onchange="toggleStop(this)">';
    html += '<span class="qc-stop-toggle__slider"></span>';
    html += '</label>';

    // Icon 112px
    html += ikonaQc(cat, id);

    // Title block
    html += '<span class="qc-stop__title">';
    html += '<span class="qc-stop__time">' + id + (s.time_label ? ' · ' + esc(s.time_label) : '') + '</span>';
    html += '<span class="qc-stop__name">' + esc(t.name || 'Przystanek ' + id) + '</span>';
    html += '</span>';

    // Meta column: pills + nav button
    html += '<span class="qc-stop__meta">';
    if (s.year_built) html += '<span class="qc-pill">' + esc(s.year_built) + '</span>';
    if (s.price) {
      var doSprawdzenia = ui('label.unverified', 'do sprawdzenia');
      html += '<span class="qc-pill">' + esc(s.price) +
              (s.price_status === 'unverified' ? ' · ' + esc(doSprawdzenia) : '') + '</span>';
    }
    if (s.visit_duration) html += '<span class="qc-pill">&#9201; ' + esc(s.visit_duration) + '</span>';
    if (s.maps_query) {
      html += '<a class="qc-btn qc-btn--primary qc-btn--sm" href="https://www.google.com/maps/search/?api=1&query=' +
              encodeURIComponent(s.maps_query) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">' + esc(ui('btn.navigate', 'Nawiguj')) + '</a>';
    }
    html += '</span>';

    // Chevron
    html += '<span class="qc-chev" aria-hidden="true">&#x25BC;</span>';
    html += '</summary>';

    // ── Stop body ──
    html += '<div class="qc-stop__body">';

    // Warning note
    if (t.practical_note) {
      html += '<p class="qc-note"><span aria-hidden="true">&#x26A0;&#xFE0F;</span><span>' + esc(t.practical_note) + '</span></p>';
    }

    // Extra links
    var extraLinks = [];
    if (s.website) extraLinks.push('<a class="qc-btn qc-btn--sm" href="' + esc(s.website) + '" target="_blank" rel="noopener">' + esc(ui('btn.www', 'WWW')) + '</a>');
    if (s.phone) extraLinks.push('<a class="qc-btn qc-btn--sm" href="tel:' + esc(String(s.phone).replace(/[^0-9+]/g, '')) + '">' + esc(ui('btn.call', 'Zadzwoń')) + '</a>');
    if (s.whatsapp) extraLinks.push('<a class="qc-btn qc-btn--sm" href="https://wa.me/' + encodeURIComponent(String(s.whatsapp).replace(/[^0-9]/g, '')) + '" target="_blank" rel="noopener">' + esc(ui(s.reservation ? 'btn.reserve' : 'btn.write', s.reservation ? 'Rezerwuj' : 'Napisz')) + '</a>');
    if (s.verify_url) extraLinks.push('<a class="qc-btn qc-btn--sm" href="' + esc(s.verify_url) + '" target="_blank" rel="noopener">' + esc(ui('btn.verify', 'Sprawdź')) + '</a>');
    if (extraLinks.length) html += '<div class="qc-links">' + extraLinks.join('') + '</div>';

    // Prose (adult description)
    if (t.desc_paragraphs && t.desc_paragraphs.length) {
      html += '<div class="qc-prose">';
      t.desc_paragraphs.forEach(function(p) { html += '<p>' + esc(p) + '</p>'; });
      html += '</div>';
    }

    // Opening hours chip
    if (s.opening_hours) {
      var doSpr = ui('label.unverified', 'do sprawdzenia');
      html += '<p class="qc-note" style="background:var(--qc-line-2);border-color:var(--qc-line);color:var(--qc-ink-2)"><span>&#128336; ' +
              esc(ui('label.hours', 'Godziny')) + ': ' + esc(s.opening_hours) +
              (s.hours_status === 'unverified' ? ' · ' + esc(doSpr) : '') + '</span></p>';
    }

    // Dress code
    if (t.dress_code) {
      html += '<p class="qc-note" style="background:var(--qc-tint-2);border-color:var(--qc-tint);color:var(--qc-ink-2)"><span>&#128085; ' +

    }

    // Local flavor
    if (t.local_flavor) {
      html += '<p class="qc-note" style="background:var(--qc-tint);border-color:#E4D5C9;color:#6E3A20"><span>' +
              esc(ui('label.local_flavor', 'Lokalny smak')) + ': ' + esc(t.local_flavor) + '</span></p>';
    }

    // Missions & photo tasks
    var hasMission = t.kids_box || t.hint;
    var hasPhoto = t.photo_task;
    if (hasMission || hasPhoto) {
      html += '<div class="qc-tasks">';
      if (t.kids_box) {
        var taskKey = (s.stop_key || s.slug || id) + '-mission';
        html += '<div class="qc-task">';
        html += '<label class="qc-task__label"><input type="checkbox" data-qc-task="' + esc(taskKey) + '">' + esc(ui('label.mission', 'Misja')) + '</label>';
        html += '<p>' + esc(t.kids_box) + '</p>';
        if (t.hint) html += '<p style="margin-top:6px;font-style:italic;color:var(--qc-ink-3)">' + esc(ui('label.hint', 'Wskazówka')) + ': ' + esc(t.hint) + '</p>';
        html += '</div>';
      }
      if (hasPhoto) {
        var photoKey = (s.stop_key || s.slug || id) + '-photo';
        html += '<div class="qc-task qc-task--photo">';
        html += '<label class="qc-task__label"><input type="checkbox" data-qc-task="' + esc(photoKey) + '">' + esc(ui('label.photo_task', 'Zadanie foto')) + '</label>';
        html += '<p>' + esc(t.photo_task) + '</p>';
        html += '</div>';
      }
      html += '</div>';
    }

    html += '</div></details>';
  });
  html += '</section>';

  // ═══ PLAN DNIA ═══
  html += '<section id="plan">';

  if (tr.subtitle) html += '<p class="qc-section__sub">' + esc(tr.subtitle) + '</p>';
  if (d.dayPlan && d.dayPlan.length) {
    html += '<div class="qc-panel">';
    d.dayPlan.forEach(function(row) {
      var kat = row.stop_key ? katPoKluczu[row.stop_key] : null;
      var opis = row.stop_key
        ? '<a href="#' + esc(row.stop_key) + '">' + esc(row.description) + '</a>'
        : esc(row.description);
      html += '<div class="qc-row">';
      html += '<span class="qc-row__time">' + esc(row.time_label) + '</span>';
      if (kat) html += ikonaMala(kat);
      html += '<span class="qc-row__what">' + opis + '</span>';
      if (row.duration) html += '<span class="qc-row__dur">' + esc(row.duration) + '</span>';
      html += '</div>';
    });
    html += '</div>';
  } else {
    html += '<p style="font-size:16px;color:var(--qc-ink-3)">' + ui('label.no_data', 'Dane wkrótce.') + '</p>';
  }
  html += '</section>';

  // ═══ PUNKTY AWARYJNE ═══
  html += '<section id="awaryjne">';
  html += '<h2 class="qc-section__title">' + esc(ui('label.emergency', 'Punkty awaryjne')) + '</h2>';
  html += '<p class="qc-section__sub">' + esc(ui('label.emergency_sub', 'Apteka, toalety, cień i plac zabaw — wszystko kilka minut od trasy.')) + '</p>';
  if (d.emergency && d.emergency.length) {
    html += '<div class="qc-cards">';
    d.emergency.forEach(function(e) {
      html += '<div class="qc-card">';
      html += '<div class="qc-card__icon" aria-hidden="true">&#128138;</div>';
      html += '<h3 class="qc-card__title">' + esc(e.label) + '</h3>';
      html += '<p>' + esc(e.description) + '</p>';
      if (e.maps_query) {
        html += '<a class="qc-card__link" href="https://maps.google.com/?q=' + encodeURIComponent(e.maps_query) + '" target="_blank" rel="noopener">' + ui('btn.navigate', 'Nawiguj') + ' →</a>';
      }
      html += '</div>';
    });
    html += '</div>';
  } else {
    html += '<p style="font-size:16px;color:var(--qc-ink-3)">' + ui('label.no_data', 'Dane wkrótce.') + '</p>';
  }
  html += '</section>';


  // ═══ TELEFONY ═══
  html += '<section id="telefony">';
  html += '<h2 class="qc-section__title">' + esc(ui('label.phones', 'Telefony')) + '</h2>';
  if (d.phones && d.phones.length) {
    html += '<div class="qc-tels">';
    d.phones.forEach(function(p) {
      var isLong = p.number.length > 6;
      html += '<a class="qc-tel" href="tel:' + esc(p.number.replace(/\s/g, '')) + '">';
      html += '<span class="qc-tel__label">' + esc(p.label) + '</span>';
      html += '<span class="qc-tel__no' + (isLong ? ' qc-tel__no--long' : '') + '">' + esc(p.number) + '</span>';
      html += '</a>';
    });
    html += '</div>';
  } else {
    html += '<p style="font-size:16px;color:var(--qc-ink-3)">' + ui('label.no_data', 'Dane wkrótce.') + '</p>';
  }
  html += '</section>';

  html += '</div>'; // end qc-main

  // ═══ SIDEBAR ═══
  html += '<aside class="qc-aside">';

  // Stats box
  html += '<div class="qc-box">';
  html += '<p class="qc-box__label">' + esc(ui('label.today_route', 'Dzisiejsza trasa')) + '</p>';
  html += '<div class="qc-stats">';
  html += '<span class="qc-stat">' + esc(ui('label.stops_label', 'Przystanki')) + ' <strong>' + stops.length + '</strong></span>';
  if (city.walk_km) html += '<span class="qc-stat">' + esc(ui('label.on_foot', 'Pieszo')) + ' <strong>' + esc(String(city.walk_km).replace('.', ',')) + ' km</strong></span>';
  if (city.climb_m) html += '<span class="qc-stat">' + esc(ui('label.uphill_label', 'Wejście w górę')) + ' <strong>' + city.climb_m + ' m</strong></span>';
  if (city.tickets_budget) html += '<span class="qc-stat">' + esc(ui('label.tickets', 'Bilety (rodzina 2+2)')) + ' <strong>' + esc(city.tickets_budget) + '</strong></span>';
  if (city.parking_cost) html += '<span class="qc-stat">' + esc(ui('label.parking', 'Parking')) + ' <strong>' + esc(city.parking_cost) + '</strong></span>';
  html += '</div>';
  if (city.sunset_time) {
    html += '<div class="qc-hr"></div>';
    html += '<p>' + esc(ui('label.sunset_today', 'Zachód słońca dziś')) + ' <strong>' + esc(city.sunset_time) + '</strong></p>';
  }
  html += '</div>';

  // QR box
  html += '<div class="qc-box qc-box--qr" id="qr">';
  html += '<p class="qc-box__label">' + esc(ui('label.qr_kid', 'QR dla dziecka')) + '</p>';
  html += '<div class="qc-qr" id="qrCode"></div>';
  html += '<p style="margin-top:12px">' + esc(ui('qr.scan_text', 'Zeskanuj na drugim telefonie — dziecko dostanie tylko misje i zadania foto.')) + '</p>';
  html += '<div class="qc-copy-row">';
  html += '<input type="text" id="qrUrlInput" readonly>';
  html += '<button type="button" onclick="var i=document.getElementById(\'qrUrlInput\');navigator.clipboard.writeText(i.value).then(function(){var b=event.target;b.textContent=\'' + esc(ui('btn.copied', 'Skopiowano!')) + '\';setTimeout(function(){b.textContent=\'' + esc(ui('btn.copy_link', 'Kopiuj link')) + '\'},1500)})">' + esc(ui('btn.copy_link', 'Kopiuj link')) + '</button>';
  html += '</div>';
  html += '</div>';

  // Intro / lead in sidebar
  if (tr.lead) {
    html += '<div class="qc-box">';
    String(tr.lead).split(/\n\s*\n/).forEach(function(par) {
      if (par.trim()) html += '<p>' + esc(par.trim()) + '</p>';
    });
    html += '</div>';
  }

  // Local food
  if (tr.local_food) {
    html += '<div class="qc-box qc-box--fest">';
    html += '<p class="qc-box__title" style="font-size:17px;font-weight:700;color:#8A4526">' + esc(ui('label.local_food', 'Lokalne jedzenie')) + '</p>';
    html += '<p>' + esc(tr.local_food) + '</p>';
    html += '</div>';
  }

  // Good to know
  if (tr.good_to_know) {
    html += '<div class="qc-box">';
    html += '<p class="qc-box__label">' + esc(ui('label.good_to_know', 'Warto wiedzieć')) + '</p>';
    html += '<p style="margin-top:10px">' + esc(tr.good_to_know) + '</p>';
    html += '</div>';
  }

  // Support link
  html += '<a class="qc-box qc-box--support" href="https://buymeacoffee.com/questini" target="_blank" rel="noopener">';
  html += '<p style="font-size:17px;font-weight:700;color:#fff">' + esc(ui('label.like_quolino', 'Podoba się Quolino?')) + '</p>';
  html += '<p>' + esc(ui('nav.support_coffee', 'Postaw nam kawę')) + ' ☕</p>';
  html += '</a>';

  html += '</aside>';
  html += '</div>'; // end qc-layout

  document.getElementById('mainContent').innerHTML = html;
}

// ── Meta / structured data ────────────────────────────
function ustawMeta(city, cityTr, stops) {
  var tytul = (cityTr.title || city.slug);
  var opis  = cityTr.subtitle || (cityTr.lead || '').split(/\n\s*\n/)[0] || '';
  if (opis.length > 300) opis = opis.slice(0, 297) + '…';
  var baza  = location.origin + location.pathname.replace(/[^/]*$/, '');
  var obraz = city.hero_image
    ? 'media/tours/' + city.hero_image + '-hero-1200.webp'
    : (city.country && city.slug ? 'media/tours/quolino-' + city.country + '-' + city.slug + '-hero-1200.webp' : '');

  function meta(atrybut, klucz, wartosc) {
    if (!wartosc) return;
    var el = document.head.querySelector('meta[' + atrybut + '="' + klucz + '"]');
    if (!el) { el = document.createElement('meta'); el.setAttribute(atrybut, klucz); document.head.appendChild(el); }
    el.setAttribute('content', wartosc);
  }
  meta('name', 'description', opis);
  meta('property', 'og:type', 'article');
  meta('property', 'og:title', tytul + ' — Quolino');
  meta('property', 'og:description', opis);
  meta('property', 'og:url', location.href);
  if (obraz) meta('property', 'og:image', baza + obraz);
  meta('name', 'twitter:card', obraz ? 'summary_large_image' : 'summary');

  var kanon = document.head.querySelector('link[rel="canonical"]');
  if (!kanon) { kanon = document.createElement('link'); kanon.rel = 'canonical'; document.head.appendChild(kanon); }
  kanon.href = location.origin + location.pathname + '?c=' + encodeURIComponent(city.slug);

  var punkty = stops.map(function(item, i) {
    var s = item.stop, t = item.tr || {};
    var miejsce = { '@type': 'TouristAttraction', name: t.name || ('Przystanek ' + (i + 1)) };
    if (t.desc_paragraphs && t.desc_paragraphs.length) miejsce.description = t.desc_paragraphs[0];
    if (s.lat && s.lon) miejsce.geo = { '@type': 'GeoCoordinates', latitude: s.lat, longitude: s.lon };
    if (s.website) miejsce.url = s.website;
    if (s.phone) miejsce.telephone = s.phone;
    return { '@type': 'ListItem', position: i + 1, item: miejsce };
  });

  var ld = {
    '@context': 'https://schema.org', '@type': 'TouristTrip',
    name: tytul, description: opis, url: kanon.href,
    touristType: 'Rodziny z dziećmi',
    itinerary: { '@type': 'ItemList', numberOfItems: punkty.length, itemListElement: punkty }
  };
  if (obraz) ld.image = baza + obraz;
  if (city.duration_hours) ld.estimatedDuration = 'PT' + city.duration_hours + 'H';

  var stary = document.getElementById('ld-wycieczka');
  if (stary) stary.remove();
  var tag = document.createElement('script');
  tag.type = 'application/ld+json'; tag.id = 'ld-wycieczka';
  tag.textContent = JSON.stringify(ld);
  document.head.appendChild(tag);
}

// ── Sticky tabs with IntersectionObserver ──────────────
function initTabs() {
  var tabs = [].slice.call(document.querySelectorAll('.qc-tab[href^="#"]'));
  var map = {};
  tabs.forEach(function(t) { map[t.getAttribute('href').slice(1)] = t; });
  var io = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) {
      if (!e.isIntersecting) return;
      tabs.forEach(function(t) { t.removeAttribute('aria-current'); });
      if (map[e.target.id]) map[e.target.id].setAttribute('aria-current', 'true');
    });
  }, { rootMargin: '-30% 0px -60% 0px' });
  Object.keys(map).forEach(function(id) {
    var el = document.getElementById(id);
    if (el) io.observe(el);
  });
}

// ── Task checkboxes (localStorage) ────────────────────
function initTaskCheckboxes() {
  document.querySelectorAll('[data-qc-task]').forEach(function(box) {
    var key = 'qc.task.' + box.dataset.qcTask;
    try { box.checked = localStorage.getItem(key) === '1'; } catch(e) {}
    box.addEventListener('change', function() {
      try { localStorage.setItem(key, box.checked ? '1' : '0'); } catch(e) {}
    });
  });
}

// ── Kid view toggle ───────────────────────────────────
document.addEventListener('click', function(e) {
  var btn = e.target.closest('#qcKidToggle');
  if (!btn) return;
  var root = document.getElementById('city');
  var kid = root.dataset.view === 'kid';
  root.dataset.view = kid ? 'adult' : 'kid';
  btn.setAttribute('aria-pressed', String(!kid));
  btn.innerHTML = '&#128065; ' + (kid ? ui('btn.kid_view', 'Widok dziecka') : ui('btn.parent_view', 'Widok rodzica'));
});

// ── Build language popup grid ──────────────────────────
function buildLangPopup() {
  var grid = document.getElementById('langGrid');
  if (!grid) return;
  grid.innerHTML = '';
  langList.forEach(function(l) {
    var btn = document.createElement('button');
    var flag = l.flag_code || l.code;
    btn.innerHTML = '<img src="https://flagcdn.com/w40/' + flag + '.png" alt="">' + esc(l.name_native);
    if (l.code === currentLang) btn.classList.add('active');
    btn.addEventListener('click', function() { switchLang(l.code, flag); });
    grid.appendChild(btn);
  });
}

function switchLang(lang) {
  document.getElementById('langPopup').classList.remove('open');
  if (lang === currentLang) return;
  loadPage(lang);
}

function updateActiveLang() {
  var lang = langList.find(function(l) { return l.code === currentLang; });
  var flag = lang && lang.flag_code ? lang.flag_code : currentLang;
  var img = document.getElementById('activeFlagImg');
  var code = document.getElementById('activeLangCode');
  if (img) img.src = 'https://flagcdn.com/w40/' + flag + '.png';
  if (code) code.textContent = currentLang.toUpperCase();
}

// ── Error state ───────────────────────────────────────
function showError(msg) {
  document.getElementById('mainContent').innerHTML = '<div class="tpl-error"><h2>Ups!</h2><p>' + esc(msg) + '</p><p><a href="./">← Wróć na stronę główną</a></p></div>';
}

// ── Keyboard: Escape closes popups ────────────────────
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    document.getElementById('langPopup').classList.remove('open');
    document.getElementById('mobileDrawer').style.display = 'none';
  }
});

// ── Sticky nav offset for tabs ────────────────────────
// Height of sticky nav = header height for tab positioning
(function() {
  var nav = document.querySelector('.sticky-nav');
  if (nav) {
    document.querySelector('.qc').style.setProperty('--qc-header-h', nav.offsetHeight + 'px');
    window.addEventListener('resize', function() {
      document.querySelector('.qc').style.setProperty('--qc-header-h', nav.offsetHeight + 'px');
    });
  }
})();

// ── Stop toggle for kid view ─────────────────────────
function toggleStop(checkbox) {
  var num = checkbox.dataset.toggleStop;
  var stop = document.querySelector('.qc-stop[data-stop-num="' + num + '"]');
  if (stop) {
    if (checkbox.checked) {
      stop.classList.remove('qc-stop--disabled');
    } else {
      stop.classList.add('qc-stop--disabled');
    }
  }
  generateKidQR(); // update QR with new hidden stops
}

function getHiddenStops() {
  var hidden = [];
  document.querySelectorAll('[data-toggle-stop]').forEach(function(cb) {
    if (!cb.checked) hidden.push(cb.dataset.toggleStop);
  });
  return hidden;
}

// ── QR code generator ────────────────────────────────
function generateKidQR() {
  var el = document.getElementById('qrCode');
  if (!el || typeof QRCode === 'undefined') return;
  var params = new URLSearchParams();
  params.set('c', citySlug);
  params.set('lang', currentLang);
  params.set('view', 'kid');
  var hidden = getHiddenStops();
  if (hidden.length) params.set('hide', hidden.join(','));
  var kidUrl = location.origin + location.pathname + '?' + params.toString();
  el.innerHTML = '';
  new QRCode(el, {
    text: kidUrl,
    width: 200,
    height: 200,
    colorDark: '#2c2416',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });
  var urlInput = document.getElementById('qrUrlInput');
  if (urlInput) urlInput.value = kidUrl;
}

// ── Auto-enable kid view from URL param ──────────────
function applyKidViewParam() {
  var params = new URLSearchParams(location.search);
  var viewParam = params.get('view');
  if (viewParam === 'kid') {
    var root = document.getElementById('city');
    if (root) root.dataset.view = 'kid';
    var btn = document.getElementById('qcKidToggle');
    if (btn) {
      btn.setAttribute('aria-pressed', 'true');
      btn.innerHTML = '&#128065; ' + ui('btn.parent_view', 'Widok rodzica');
    }
    // Hide stops from URL param
    var hideParam = params.get('hide');
    if (hideParam) {
      hideParam.split(',').forEach(function(num) {
        var stop = document.querySelector('.qc-stop[data-stop-num="' + num.trim() + '"]');
        if (stop) stop.style.display = 'none';
      });
    }
  }
}

// ── Init ──────────────────────────────────────────────
loadPage(currentLang);

})();
</script>
