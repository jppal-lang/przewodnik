          <div class="atlas-region atlas-region--soon"><span class="atlas-region__no">02</span><span class="atlas-region__art"></span><span class="atlas-region__txt"><span class="atlas-region__name">&nbsp;</span><span class="atlas-region__meta">&nbsp;</span></span></div>

  <script>(function () { var q = window.QPAGE && QPAGE.kind === 'country' && QPAGE.name; var n = document.getElementById('skelName'); if (n && q) n.textContent = String(q); })();</script>

<script>
// ══════════════ CONFIG ══════════════
var SB_URL = 'https://api.quolino.com/rest/v1';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50d3BqY3VwZmZkb3pzdGJpamhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMzc5MTUsImV4cCI6MjEwMjgxMzkxNX0.OddjLt-gKKmj2H7wrEKJ14CXrsXu0L4UBO2GC9OiCGo';
var FALLBACK = 'pl';

// ══════════════ STATE ══════════════
var countrySlug = (window.QPAGE && QPAGE.kind === 'country' && QPAGE.id) || new URLSearchParams(location.search).get('k');   // ładny adres z serwera (JP 2026-10-18)
var currentLang = window.QLang ? QLang.pick() : (new URLSearchParams(location.search).get('lang') || (window.QPAGE && QPAGE.lang) || readPref() || 'en');   // K5: lang-pick.js
var langList = [];
var uiStrings = {};

// ══════════════ HELPERS ══════════════
function sb(table, params) {
  var url = SB_URL + '/' + table + (params ? '?' + params : '');
  return fetch(url, { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY } })
    .then(function(r) { if (!r.ok) throw new Error(r.status + ' ' + table); return r.json(); });
}
function readPref()  { try { return localStorage.getItem('quolino_lang'); } catch(e) { return null; } }
// K7 (JP 2026-10-28): poza polskim tylko miasta z tłumaczeniem w tym języku i gotową stroną (mapa adresów z serwera)
var PATHS_READY = fetch('/pl/paths/').then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; });
function availableCities(cities, cityTrs, paths, lang) {
  if (lang === 'pl') return cities;
  var has = {}, ok = Object.keys(paths || {}).some(function (k) { return k.charAt(0) !== '_'; });
  (cityTrs || []).forEach(function (t) { if (t.lang === lang) has[t.city_slug] = 1; });
  return cities.filter(function (c) { return has[c.slug] && (!ok || (paths[c.slug] && paths[c.slug][lang])); });
}
function savePref(l) { try { localStorage.setItem('quolino_lang', l); } catch(e) {} }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function ui(key, fb) { return uiStrings[key] || (window.QUI && window.QUI.t(key)) || fb || key; }
// Liczebniki: po polsku odmiana (1 plan / 2–4 plany / 5+ planów), w innych językach „etykieta: N” (JP 2026-10-29)
function plForm(n, f) { var m = n % 10, h = n % 100; return n === 1 ? f[0] : (m >= 2 && m <= 4 && !(h >= 12 && h <= 14)) ? f[1] : f[2]; }
function countLabel(n, key, fb, forms) { return String(currentLang).toLowerCase() === 'pl' ? n + ' ' + plForm(n, forms) : ui(key, fb) + ': ' + n; }
var PLANS = ['gotowy plan', 'gotowe plany', 'gotowych planów'];
// teksty page.* (ekran „Wkrótce”): PT('klucz', 'polski') — skaner ui-translate.mjs czyta je z tego pliku, tłumaczenia w uiStrings
function PT(key, pl) { return ui(key, pl); }

// ══════ GRAFIKI TRAS ══════
// Jedna grafika z Que na wycieczke, robiona lokalnie skryptem img/!build-img.py.
// Nazwa wynika ze slugow: media/tours/<kraj>-<miasto>-tile-384.webp itd.
// Zadnych zapytan do Wikipedii i zadnego cache w localStorage — pliki sa nasze,
// wiec wystarczy poprawna sciezka i przegladarkowy cache.
var IMG_DIR = '/media/tours/';

function imgBase(city) {
  if (!city) return '';
  if (city.hero_image) return IMG_DIR + city.hero_image; // nadpisanie z bazy (sama nazwa pliku, jak w region.html)
  if (!city.country || !city.slug) return '';
  return IMG_DIR + 'quolino-' + city.country + '-' + city.slug;
}
function showFallback(wrap, color, letter) {
  wrap.classList.remove('loading');
  if (wrap.querySelector('.city-fallback')) return;
  wrap.style.background = color || '#0B4EA2';
  var d = document.createElement('div');
  d.className = 'city-fallback';
  d.textContent = (letter || '?').charAt(0).toUpperCase();
  wrap.appendChild(d);
}
function loadCover(wrap, city, letter) {
  var base = imgBase(city);
  var color = city ? city.bandana_color : null;
  if (!base) { showFallback(wrap, color, letter); return; }
  var img = document.createElement('img');
  img.className = 'city-img';
  img.alt = ''; img.loading = 'lazy'; img.decoding = 'async';
  img.width = 768; img.height = 768;
  img.src    = base + '-tile-384.webp';
  img.srcset = base + '-tile-384.webp 384w, ' + base + '-tile-768.webp 768w';
  img.sizes  = '(max-width:560px) 92vw, 300px';
  img.onload  = function() { wrap.classList.remove('loading'); img.classList.add('loaded'); };
  // brak pliku = jeszcze nie narysowany — wtedy gradient z litera, bez bledu w konsoli
  img.onerror = function() { img.remove(); showFallback(wrap, color, letter); };
  wrap.appendChild(img);
}

// ══════════════ LOAD PAGE ══════════════
function loadPage(lang) {
  currentLang = lang;
  savePref(lang);
  document.documentElement.lang = lang;
  if (window.QPlace) QPlace.sync('country', countrySlug, lang);   // adres w pasku = ładny adres w tym języku

  if (!countrySlug) { location.replace('/#regiony'); return; }   // goły adres bez kraju → mapa regionów na stronie głównej

  Promise.all([
    sb('languages', 'select=code,name_native,flag_code&enabled=eq.true&order=priority'),
    sb('ui_translations', 'select=key,lang,value&or=(key.not.like.page.*,key.like.page.footer.*)&lang=eq.' + lang),   // bez page.* (poza stopką) — D2 2026-10-29
    sb('regions', 'select=slug,url_slug,country_slug,hero_image,sort_order&order=sort_order'),
    sb('region_translations', 'select=region_slug,lang,name,description&lang=eq.' + lang),
    sb('countries', 'select=slug,flag_code,sort_order,continent&order=sort_order'),
    sb('country_translations', 'select=country_slug,lang,name&lang=eq.' + lang),
    sb('cities', 'status=eq.published&select=slug,country,region_slug,bandana_color,hero_image,sort_order,lat,lon&order=sort_order'),
    sb('city_translations', 'lang=eq.' + lang + '&select=city_slug,lang'),
    PATHS_READY
  ]).then(function(res) {
    if (lang !== currentLang) return;   // w międzyczasie wybrano inny język
    langList        = res[0];
    var uiRows      = res[1];
    var allRegions  = res[2];
    var regionTrs   = res[3];
    var countries   = res[4];
    var countryTrs  = res[5];
    var allCities   = availableCities(res[6] || [], res[7], res[8], lang);

    uiStrings = {};
    uiRows.forEach(function(r) { uiStrings[r.key] = r.value; });
    document.querySelectorAll("[data-t]").forEach(function(el) { var v = uiStrings[el.getAttribute("data-t")]; if (v) el.textContent = v; });   // stopka (R-3)

    buildLangPopup();
    updateActiveLang();
    document.querySelectorAll('[data-ui]').forEach(function(el) {
      var v = uiStrings[el.getAttribute('data-ui')];
      if (v) el.textContent = v;
    });

    var country = countries.filter(function(c) { return c.slug === countrySlug; })[0];
    if (!country) { fail(ui('error.country_not_found', 'Nie znaleźliśmy tego kraju.')); return; }

    var cTr         = countryTrs.filter(function(t) { return t.country_slug === countrySlug; })[0];
    var countryName = cTr ? cTr.name : countrySlug;
    var continent   = country.continent || 'europe';

    document.title = countryName + ' ' + ui('seo.with_kids', 'z dziećmi') + ' — ' + ui('seo.trip_plans', 'gotowe plany wycieczek') + ' | Quolino';
    buildCrumbs(continent, countryName);
    buildCountry(country, countryName, allRegions, regionTrs, allCities,
                 countries, countryTrs);
  }).catch(function(err) {
    console.error('Supabase error:', err);
    fail(ui('error.load', 'Nie udało się wczytać danych. Odśwież stronę.'));
  });
}

function fail(msg) {
  document.getElementById('pageContent').removeAttribute('aria-busy');
  document.getElementById('pageContent').innerHTML =
    '<div class="state-msg">' + esc(msg) + '<br><br><a href="/">' + esc(ui('nav.home', 'Strona główna')) + '</a></div>';
}

// ══════════════ BREADCRUMBS ══════════════
// 🏠 › Europa › Włochy
function buildCrumbs(continent, countryName) {
  var nav = document.getElementById('crumbs');
  if (!nav) return;
  var homeLabel = ui('nav.home', 'Strona główna');
  var html = '';

  html += '<a class="crumb-home" href="/" title="' + esc(homeLabel) + '" aria-label="' + esc(homeLabel) + '">' +
            '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>' +
          '</a>';

  var levels = [
    { label: ui('continent.' + continent, 'Europa'), href: '/#regiony' },
    { label: countryName,                            href: null }
  ];

  levels.forEach(function(l) {
    if (!l.label) return;
    html += '<span class="crumb-sep" aria-hidden="true">&rsaquo;</span>';
    html += l.href
      ? '<a href="' + l.href + '">' + esc(l.label) + '</a>'
      : '<span class="crumb-current" aria-current="page">' + esc(l.label) + '</span>';
  });

  nav.innerHTML = html;
}

// ══════════════ KRAJ + KAFLE REGIONÓW ══════════════
function buildCountry(country, countryName, allRegions, regionTrs, allCities,
                      countries, countryTrs) {
  var el = document.getElementById('pageContent');
  el.removeAttribute('aria-busy');
  var html = '';

  // miasta pogrupowane po regionie (juz posortowane sort_order)
  var byRegion = {};
  allCities.forEach(function(c) {
    if (!byRegion[c.region_slug]) byRegion[c.region_slug] = [];
    byRegion[c.region_slug].push(c);
  });

  var regions = allRegions.filter(function(r) {
    return r.country_slug === country.slug && byRegion[r.slug] && byRegion[r.slug].length;
  });
  var cityTotal = regions.reduce(function(n, r) { return n + byRegion[r.slug].length; }, 0);

  // ── Hero ──
  html += '<div class="region-hero band page-band">';
  html += '<h1 class="region-name">' + esc(countryName) + '</h1>';
  html += '<div class="region-meta"><span>' + (country.flag_code ? '<img src="/media/flags/' + country.flag_code + '.png" alt="">' : '') + esc(ui('continent.' + (country.continent || 'europe'), 'Europa')) + '</span><span>' + esc(cityTotal ? countLabel(cityTotal, 'home.region_ready', 'gotowe plany', PLANS) : ui('chip.soon', 'Wkrótce')) + '</span></div>';
  html += '</div>';

  // I-5 (JP 2026-10-29): kraj bez tras — zaproszenie z Quo zamiast „Jeszcze nic tu nie ma” (jak ekran „Wkrótce” regionu)
  if (!regions.length) {
    html += '<section class="soon-screen" aria-labelledby="soonTitle">' +
      '<img class="soon-screen__quo" src="/media/icons/quo-wkrotce-256.webp" srcset="/media/icons/quo-wkrotce-256.webp 1x, /media/icons/quo-wkrotce-512.webp 2x" width="180" height="180" alt="" decoding="async">' +
      '<h2 id="soonTitle"><span data-k="page.country.soon_title">' + esc(PT('page.country.soon_title', 'Quo szykuje tu trasy')) + '</span></h2>' +
      '<p><span data-k="page.country.soon_lead">' + esc(PT('page.country.soon_lead', 'Mapa już leży na stole, a plecak czeka przy drzwiach. Pierwsze rodzinne trasy w tym kraju pojawią się wkrótce. Do tego czasu ruszcie tam, gdzie Quo już był.')) + '</span></p>' +
      '<p class="nf__acts"><a class="qc-btn qc-btn--primary" href="/?lang=' + esc(currentLang) + '#regiony"><span data-k="page.country.soon_regions">' + esc(PT('page.country.soon_regions', 'Zobacz gotowe regiony')) + '</span></a>' +
      '<a class="qc-btn" href="/?lang=' + esc(currentLang) + '"><span data-k="page.country.soon_home">' + esc(PT('page.country.soon_home', 'Strona główna')) + '</span></a></p></section>';
    el.innerHTML = html;
    // teksty page.country.* nie przychodzą w uiStrings (zapytanie bez page.*) — jedno małe zapytanie tylko tutaj; brak → angielski → polski
    if (currentLang !== 'pl') {
      var soonLang = currentLang;
      sb('ui_translations', 'select=key,lang,value&key=like.page.country.soon*&lang=in.(' + encodeURIComponent(soonLang) + ',en)').then(function (rows) {
        if (soonLang !== currentLang) return;
        var d = {}, en = {};
        (rows || []).forEach(function (r) { (r.lang === soonLang ? d : en)[r.key] = r.value; });
        document.querySelectorAll('.soon-screen [data-k]').forEach(function (n) { var v = d[n.getAttribute('data-k')] || en[n.getAttribute('data-k')]; if (v) n.textContent = v; });
      }).catch(function () { /* zostaje polski */ });
    }
    return;
  }

  // ── Mapa kraju z Quo + spis regionów (atlas.js) ──
  html += '<div class="atlas-host" id="atlas"></div>';

  // ── Inne kraje ──
  var otherCountries = countries.filter(function(c) {
    if (c.slug === country.slug) return false;
    return allRegions.some(function(r) {
      return r.country_slug === c.slug && byRegion[r.slug] && byRegion[r.slug].length;
    });
  });

  if (otherCountries.length) {
    html += '<div class="other-regions"><p class="caps">' + esc(ui('label.other_countries', 'Inne kraje')) + '</p><div class="other-region-grid">';
    otherCountries.forEach(function(oc) {
      var oTr   = countryTrs.filter(function(t) { return t.country_slug === oc.slug; })[0];
      var oName = oTr ? oTr.name : oc.slug;
      var oCnt  = allRegions.filter(function(r) { return r.country_slug === oc.slug; })
                            .reduce(function(n, r) { return n + ((byRegion[r.slug] || []).length); }, 0);
      html += '<a class="other-region-tile" href="/country.html?k=' + encodeURIComponent(oc.slug) + '">';
      html += '<div class="ort-body"><div class="ort-name">' + esc(oName) + '</div>';
      html += '<div class="ort-meta">' + esc(countLabel(oCnt, 'home.region_ready', 'gotowe plany', PLANS)) + '</div></div>';
      html += '<div class="ort-go" aria-hidden="true">&rarr;</div></a>';
    });
    html += '</div></div>';
  }

  el.innerHTML = html;

  if (window.QuoAtlas) QuoAtlas.render({ mount: 'atlas', start: country.slug, homeHref: '/#regiony', lang: currentLang, ui: ui, imgBase: imgBase,
    regions: allRegions, regionTrs: regionTrs, countries: countries, countryTrs: countryTrs, cities: allCities });
}

// ══════════════ LANGUAGE POPUP ══════════════
function buildLangPopup() {
  var grid = document.getElementById('langGrid');
  if (!grid) return;
  grid.innerHTML = '';
  langList.forEach(function(l) {
    var btn = document.createElement('button');
    btn.innerHTML = '<img src="/media/flags/' + (l.flag_code || l.code) + '.png" alt="">' + esc(l.name_native);
    if (l.code === currentLang) btn.classList.add('active');
    btn.addEventListener('click', function() {
      document.getElementById('langPopup').classList.remove('open');
      if (l.code !== currentLang) loadPage(l.code);
    });
    grid.appendChild(btn);
  });
}

function updateActiveLang() {
  var l = langList.filter(function(x) { return x.code === currentLang; })[0];
  var flag = (l && l.flag_code) ? l.flag_code : currentLang;
  var img = document.getElementById('activeFlagImg');
  var dimg = document.getElementById('drawerFlagImg');
  var code = document.getElementById('activeLangCode');
  if (img)  img.src  = '/media/flags/' + flag + '.png';
  if (dimg) dimg.src = '/media/flags/' + flag + '.png';
  if (code) code.textContent = currentLang.toUpperCase();
}

// ══════════════ KEYBOARD ══════════════
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    document.getElementById('langPopup').classList.remove('open');
    document.getElementById('mobileDrawer').style.display = 'none';
  }
});

// ══════════════ INIT ══════════════
loadPage(currentLang);
</script>
