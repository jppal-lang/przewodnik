<!DOCTYPE html>
<html lang="pl">
<head>

<link rel="stylesheet" href="styles.css?v=11">
</head>
<body>

<!-- Sticky nav -->
<nav class="sticky-nav">

    <a href="./" class="logo">
      <span class="logo-name">quolino</span><span class="logo-dot">.</span><span class="logo-tld">com</span>
    </a>
    <div class="nav-right">
      <div class="nav-desktop">
        <button class="nav-lang-btn" onclick="document.getElementById('langPopup').classList.add('open')" aria-label="Language">
          <img src="https://flagcdn.com/w40/pl.png" alt="" id="activeFlagImg">
          <span id="activeLangCode">PL</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
        <a class="bmc-link" href="https://buymeacoffee.com/questini" target="_blank" rel="noopener">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 6h14v2H3zm0 4h14v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zm14-4h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M7 2v4M11 2v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg><span data-ui="nav.support">Wesprzyj</span>
        </a>
      </div>
      <button class="nav-mobile" onclick="document.getElementById('mobileDrawer').style.display='flex'" aria-label="Menu" style="width:48px;height:48px;border:none;cursor:pointer;border-radius:12px;background:transparent;display:grid;align-items:center;justify-content:center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg>
      </button>
    </div>
  </div>
</nav>

<!-- Mobile drawer -->
<div id="mobileDrawer" style="display:none;position:fixed;inset:0;z-index:200;background:rgba(6,42,88,.45)" onclick="this.style.display='none'">
  <div style="position:absolute;top:0;left:0;right:0;background:var(--parchment);border-radius:0 0 20px 20px;box-shadow:var(--lift-3);padding:0 20px 28px" onclick="event.stopPropagation()">
    <div style="display:flex;align-items:center;justify-content:space-between;min-height:56px">
      <div class="logo"><span class="logo-name">quolino</span><span class="logo-dot">.</span><span class="logo-tld">com</span></div>
      <button onclick="document.getElementById('mobileDrawer').style.display='none'" aria-label="Close" style="width:48px;height:48px;border:none;cursor:pointer;border-radius:12px;background:transparent;display:grid;place-items:center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
      </button>
    </div>
    <a href="./" onclick="document.getElementById('mobileDrawer').style.display='none'" style="display:flex;align-items:center;justify-content:center;height:52px;background:var(--azzurro-50);border:2px solid var(--azzurro);border-radius:14px;font-size:18px;font-weight:700;color:var(--terra);margin-bottom:16px" data-ui="nav.select_region">Wybierz region</a>
    <div style="font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--label);margin-bottom:10px" data-ui="nav.lang_label">Język</div>
    <button onclick="document.getElementById('langPopup').classList.add('open');document.getElementById('mobileDrawer').style.display='none'" style="width:100%;height:52px;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:14px;border:2px solid var(--line);background:var(--parchment);cursor:pointer;font-size:18px;font-weight:700;color:var(--ink);margin-bottom:16px">
      <img src="https://flagcdn.com/w40/pl.png" alt="" id="drawerFlagImg" style="width:22px;height:16px;border-radius:3px;border:1px solid rgba(56,48,38,.12);object-fit:cover"> <span data-ui="nav.change_lang">Zmień język</span>
    </button>
    <a href="https://buymeacoffee.com/questini" target="_blank" rel="noopener" style="height:52px;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--terra);color:var(--parchment);border-radius:14px;font-size:18px;font-weight:700">&#9749; <span data-ui="nav.support_project">Wesprzyj projekt</span></a>
  </div>
</div>

<!-- Language popup -->
<div class="lang-overlay" id="langPopup" onclick="this.classList.remove('open')">
  <div class="lang-popup" onclick="event.stopPropagation()">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <div style="font-size:22px;font-weight:800;letter-spacing:-.015em" data-ui="nav.select_lang">Wybierz język</div>
      <button onclick="document.getElementById('langPopup').classList.remove('open')" aria-label="Close" style="width:44px;height:44px;border:none;cursor:pointer;border-radius:12px;background:transparent;display:grid;place-items:center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
      </button>
    </div>
    <div class="lang-grid" id="langGrid"></div>
  </div>
</div>

<div class="wrap-wide">

  <!-- Breadcrumbs -->
  <nav class="crumbs band" id="crumbs" aria-label="Breadcrumb"></nav>

  <!-- Country content -->
  <div id="pageContent">
    <div class="state-msg">&#8230;</div>
  </div>

  <div class="footer">
    <div class="logo">
      <span class="logo-name">quolino</span><span class="logo-dot">.</span><span class="logo-tld">com</span>
    </div>
    <span data-ui="home.footer">&copy; 2026 &middot; Rodzinne przewodniki wypadowe</span>
  </div>

</div>

<script>
// ══════════════ CONFIG ══════════════
var SB_URL = 'https://ntwpjcupffdozstbijhh.supabase.co/rest/v1';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50d3BqY3VwZmZkb3pzdGJpamhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMzc5MTUsImV4cCI6MjEwMjgxMzkxNX0.OddjLt-gKKmj2H7wrEKJ14CXrsXu0L4UBO2GC9OiCGo';
var FALLBACK = 'pl';

// ══════════════ STATE ══════════════
var countrySlug = new URLSearchParams(location.search).get('k');
var currentLang = new URLSearchParams(location.search).get('lang') || readPref() || FALLBACK;
var langList = [];
var uiStrings = {};

// ══════════════ HELPERS ══════════════
function sb(table, params) {
  var url = SB_URL + '/' + table + (params ? '?' + params : '');
  return fetch(url, { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY } })
    .then(function(r) { if (!r.ok) throw new Error(r.status + ' ' + table); return r.json(); });
}
function readPref()  { try { return localStorage.getItem('quolino_lang'); } catch(e) { return null; } }
function savePref(l) { try { localStorage.setItem('quolino_lang', l); } catch(e) {} }
function esc(s) { if (s == null) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function ui(key, fb) { return uiStrings[key] || fb || key; }

// ══════ GRAFIKI TRAS ══════
// Jedna grafika z Que na wycieczke, robiona lokalnie skryptem img/!build-img.py.
// Nazwa wynika ze slugow: media/tours/<kraj>-<miasto>-tile-384.webp itd.
// Zadnych zapytan do Wikipedii i zadnego cache w localStorage — pliki sa nasze,
// wiec wystarczy poprawna sciezka i przegladarkowy cache.
var IMG_DIR = 'media/tours/';

function imgBase(city) {
  if (!city) return '';
  if (city.hero_image) return city.hero_image;          // nadpisanie z bazy
  if (!city.country || !city.slug) return '';
  return IMG_DIR + city.country + '-' + city.slug;
}
function showFallback(wrap, color, letter) {
  wrap.classList.remove('loading');
  if (wrap.querySelector('.city-fallback')) return;
  wrap.style.background = color || '#0B4EA2';
  var d = document.createElement('div');
  d.className = 'city-fallback';
  d.textContent = (letter || '?').charAt(0).toUpperCase();
  wrap.appendChild(d);
}
function loadCover(wrap, city, letter) {
  var base = imgBase(city);
  var color = city ? city.bandana_color : null;
  if (!base) { showFallback(wrap, color, letter); return; }
  var img = document.createElement('img');
  img.className = 'city-img';
  img.alt = ''; img.loading = 'lazy'; img.decoding = 'async';
  img.width = 768; img.height = 768;
  img.src    = base + '-tile-384.webp';
  img.srcset = base + '-tile-384.webp 384w, ' + base + '-tile-768.webp 768w';
  img.sizes  = '(max-width:560px) 92vw, 300px';
  img.onload  = function() { wrap.classList.remove('loading'); img.classList.add('loaded'); };
  // brak pliku = jeszcze nie narysowany — wtedy gradient z litera, bez bledu w konsoli
  img.onerror = function() { img.remove(); showFallback(wrap, color, letter); };
  wrap.appendChild(img);
}

// ══════════════ LOAD PAGE ══════════════
function loadPage(lang) {
  currentLang = lang;
  savePref(lang);
  document.documentElement.lang = lang;

  if (!countrySlug) { fail('Brak parametru kraju.'); return; }

  Promise.all([
    sb('languages', 'enabled=eq.true&order=priority'),
    sb('ui_translations', 'lang=eq.' + lang),
    sb('regions', 'select=*&order=sort_order'),
    sb('region_translations', 'lang=eq.' + lang),
    sb('countries', 'select=*&order=sort_order'),
    sb('country_translations', 'lang=eq.' + lang),
    sb('cities', 'status=eq.published&select=slug,country,region_slug,bandana_color,hero_image,sort_order&order=sort_order')
  ]).then(function(res) {
    langList        = res[0];
    var uiRows      = res[1];
    var allRegions  = res[2];
    var regionTrs   = res[3];
    var countries   = res[4];
    var countryTrs  = res[5];
    var allCities   = res[6];

    uiStrings = {};
    uiRows.forEach(function(r) { uiStrings[r.key] = r.value; });

    buildLangPopup();
    updateActiveLang();
    document.querySelectorAll('[data-ui]').forEach(function(el) {
      var v = uiStrings[el.getAttribute('data-ui')];
      if (v) el.textContent = v;
    });

    var country = countries.filter(function(c) { return c.slug === countrySlug; })[0];
    if (!country) { fail(ui('error.country_not_found', 'Nie znaleźliśmy tego kraju.')); return; }

    var cTr         = countryTrs.filter(function(t) { return t.country_slug === countrySlug; })[0];
    var countryName = cTr ? cTr.name : countrySlug;
    var continent   = country.continent || 'europe';

    document.title = countryName + ' — Quolino';
    buildCrumbs(continent, countryName);
    buildCountry(country, countryName, allRegions, regionTrs, allCities,
                 countries, countryTrs);
  }).catch(function(err) {
    console.error('Supabase error:', err);
    fail(ui('error.load', 'Nie udało się wczytać danych. Odśwież stronę.'));
  });
}

function fail(msg) {
  document.getElementById('pageContent').innerHTML =
    '<div class="state-msg">' + esc(msg) + '<br><br><a href="./">' + esc(ui('nav.home', 'Strona główna')) + '</a></div>';
}

// ══════════════ BREADCRUMBS ══════════════
// 🏠 › Europa › Włochy
function buildCrumbs(continent, countryName) {
  var nav = document.getElementById('crumbs');
  if (!nav) return;
  var homeLabel = ui('nav.home', 'Strona główna');
  var html = '';

  html += '<a class="crumb-home" href="./" title="' + esc(homeLabel) + '" aria-label="' + esc(homeLabel) + '">' +
            '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>' +
          '</a>';

  var levels = [
    { label: ui('continent.' + continent, 'Europa'), href: './#regiony' },
    { label: countryName,                            href: null }
  ];

  levels.forEach(function(l) {
    if (!l.label) return;
    html += '<span class="crumb-sep" aria-hidden="true">&rsaquo;</span>';
    html += l.href
      ? '<a href="' + l.href + '">' + esc(l.label) + '</a>'
      : '<span class="crumb-current" aria-current="page">' + esc(l.label) + '</span>';
  });

  nav.innerHTML = html;
}

// ══════════════ KRAJ + KAFLE REGIONÓW ══════════════
function buildCountry(country, countryName, allRegions, regionTrs, allCities,
                      countries, countryTrs) {
  var el = document.getElementById('pageContent');
  var html = '';

  // miasta pogrupowane po regionie (juz posortowane sort_order)
  var byRegion = {};
  allCities.forEach(function(c) {
    if (!byRegion[c.region_slug]) byRegion[c.region_slug] = [];
    byRegion[c.region_slug].push(c);
  });

  var regions = allRegions.filter(function(r) {
    return r.country_slug === country.slug && byRegion[r.slug] && byRegion[r.slug].length;
  });
  var cityTotal = regions.reduce(function(n, r) { return n + byRegion[r.slug].length; }, 0);

  // ── Hero ──
  html += '<div class="region-hero band page-band">';
  html += '<h1 class="region-name">' + esc(countryName) + '</h1>';
  html += '<div class="region-meta"><span>' + (country.flag_code ? '<img src="https://flagcdn.com/w40/' + country.flag_code + '.png" alt="">' : '') + esc(ui('continent.' + (country.continent || 'europe'), 'Europa')) + '</span><span>' + cityTotal + ' ' + esc(ui('home.region_ready', 'gotowe plany')) + '</span></div>';
  html += '</div>';

  if (!regions.length) {
    html += '<div class="state-msg">' + esc(ui('error.no_regions', 'Jeszcze nic tu nie ma — wracamy wkrótce.')) + '</div>';
    el.innerHTML = html;
    return;
  }

  // ── Kafle regionów ──
  html += '<div class="city-grid" id="regionGrid"></div>';

  // ── Inne kraje ──
  var otherCountries = countries.filter(function(c) {
    if (c.slug === country.slug) return false;
    return allRegions.some(function(r) {
      return r.country_slug === c.slug && byRegion[r.slug] && byRegion[r.slug].length;
    });
  });

  if (otherCountries.length) {
    html += '<div class="other-regions"><p class="caps">' + esc(ui('label.other_countries', 'Inne kraje')) + '</p><div class="other-region-grid">';
    otherCountries.forEach(function(oc) {
      var oTr   = countryTrs.filter(function(t) { return t.country_slug === oc.slug; })[0];
      var oName = oTr ? oTr.name : oc.slug;
      var oCnt  = allRegions.filter(function(r) { return r.country_slug === oc.slug; })
                            .reduce(function(n, r) { return n + ((byRegion[r.slug] || []).length); }, 0);
      html += '<a class="other-region-tile" href="country.html?k=' + encodeURIComponent(oc.slug) + '">';
      html += '<div class="ort-body"><div class="ort-name">' + esc(oName) + '</div>';
      html += '<div class="ort-meta">' + oCnt + ' ' + esc(ui('home.region_ready', 'gotowe plany')) + '</div></div>';
      html += '<div class="ort-go" aria-hidden="true">&rarr;</div></a>';
    });
    html += '</div></div>';
  }

  el.innerHTML = html;

  var grid = document.getElementById('regionGrid');
  regions.forEach(function(reg) {
    var rTr        = regionTrs.filter(function(t) { return t.region_slug === reg.slug; })[0];
    var regionName = rTr ? rTr.name : reg.slug;
    var regCities  = byRegion[reg.slug];

    var card = document.createElement('a');
    card.className = 'city-card';
    card.href = 'region.html?r=' + encodeURIComponent(reg.slug);
    if (regCities[0] && regCities[0].bandana_color) card.style.setProperty('--team', regCities[0].bandana_color);

    var no = document.createElement('span');
    no.className = 'sticker-no';
    no.textContent = String(grid.children.length + 1).padStart(2, '0');
    card.appendChild(no);
    var wrap = document.createElement('div');
    wrap.className = 'city-img-wrap loading';
    card.appendChild(wrap);

    var body = document.createElement('div');
    body.className = 'city-body';
    body.innerHTML =
      '<div class="city-head"><div class="city-name">' + esc(regionName) + '</div></div>' +
      (rTr && rTr.description ? '<div class="city-sub">' + esc(rTr.description) + '</div>' : '') +
      '<div class="city-foot"><span>' + regCities.length + ' ' + esc(ui('home.region_ready', 'gotowe plany')) + '</span></div>' +
      '<div class="city-go"><span>' + esc(ui('home.cta_open', 'Zaczynamy!')) + '</span><span class="arrow" aria-hidden="true">&rarr;</span></div>';
    card.appendChild(body);

    grid.appendChild(card);
    loadCover(wrap, regCities[0], regionName);
  });
}

// ══════════════ LANGUAGE POPUP ══════════════
function buildLangPopup() {
  var grid = document.getElementById('langGrid');
  if (!grid) return;
  grid.innerHTML = '';
  langList.forEach(function(l) {
    var btn = document.createElement('button');
    btn.innerHTML = '<img src="https://flagcdn.com/w40/' + (l.flag_code || l.code) + '.png" alt="">' + esc(l.name_native);
    if (l.code === currentLang) btn.classList.add('active');
    btn.addEventListener('click', function() {
      document.getElementById('langPopup').classList.remove('open');
      if (l.code !== currentLang) loadPage(l.code);
    });
    grid.appendChild(btn);
  });
}

function updateActiveLang() {
  var l = langList.filter(function(x) { return x.code === currentLang; })[0];
  var flag = (l && l.flag_code) ? l.flag_code : currentLang;
  var img = document.getElementById('activeFlagImg');
  var dimg = document.getElementById('drawerFlagImg');
  var code = document.getElementById('activeLangCode');
  if (img)  img.src  = 'https://flagcdn.com/w40/' + flag + '.png';
  if (dimg) dimg.src = 'https://flagcdn.com/w40/' + flag + '.png';
  if (code) code.textContent = currentLang.toUpperCase();
}

// ══════════════ KEYBOARD ══════════════
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    document.getElementById('langPopup').classList.remove('open');
    document.getElementById('mobileDrawer').style.display = 'none';
  }
});

// ══════════════ INIT ══════════════
loadPage(currentLang);
</script>
<script src="motion.js?v=2" defer></script>
</body>
</html>
