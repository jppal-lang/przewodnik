<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quolino — kraj</title>
<meta name="robots" content="index, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://upload.wikimedia.org">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=5">
<style>
/* ── Sticky nav ─────────────────────────────────────── */
.sticky-nav{position:sticky;top:0;z-index:100;background:rgba(255,252,245,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(231,219,198,.6);box-shadow:var(--sh1);padding:0 20px}
.sticky-nav-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.nav-right{display:flex;align-items:center;gap:12px}
.nav-lang-btn{height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;border:1.5px solid var(--line);border-radius:999px;background:transparent;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer}
.nav-lang-btn:hover{border-color:var(--terra)}
.nav-lang-btn img{width:20px;height:14px;border-radius:3px;border:1px solid rgba(56,48,38,.12);object-fit:cover}
.bmc-link{height:44px;display:inline-flex;align-items:center;gap:8px;padding:0 16px;background:#FFDD00;color:var(--ink);border-radius:999px;font-size:15px;font-weight:700;box-shadow:var(--sh1)}
.bmc-link:hover{background:#F5D000}

/* ── Lang popup ─────────────────────────────────────── */
.lang-overlay{display:none;position:fixed;inset:0;z-index:300;background:rgba(56,48,38,.4);place-items:center;padding:20px}
.lang-overlay.open{display:grid}
.lang-popup{background:var(--parchment);border-radius:24px;padding:28px;box-shadow:0 8px 48px rgba(60,42,20,.2);max-width:560px;width:100%;max-height:80vh;overflow-y:auto}
.lang-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.lang-grid button{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;border:2px solid transparent;border-radius:14px;background:transparent;font-size:16px;font-weight:500;color:var(--ink);cursor:pointer}
.lang-grid button:hover{border-color:var(--terra);background:rgba(180,80,46,.04)}
.lang-grid button.active{border-color:var(--terra);background:rgba(180,80,46,.06);font-weight:700;color:var(--terra)}
.lang-grid button img{width:24px;height:17px;border-radius:3px;border:1px solid rgba(56,48,38,.12);object-fit:cover}

/* ── Breadcrumbs ────────────────────────────────────── */
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:2px;padding:20px 0 4px;font-size:15px;line-height:1.4}
.crumbs a,.crumbs span.crumb-current{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:9px;color:var(--ink2);white-space:nowrap;transition:background .15s,color .15s}
.crumbs a:hover{background:rgba(180,80,46,.08);color:var(--terra)}
.crumbs a.crumb-home{padding:5px 8px}
.crumbs a.crumb-home svg{display:block}
.crumbs span.crumb-current{color:var(--ink);font-weight:700;cursor:default}
.crumb-sep{color:var(--line);flex-shrink:0;user-select:none;font-size:16px}
@media(max-width:520px){
  .crumbs{font-size:14px;gap:0}
  .crumbs a,.crumbs span.crumb-current{padding:4px 6px}
}

/* ── Region hero ────────────────────────────────────── */
.region-hero{padding:8px 0 0}
.region-name{font-size:40px;font-weight:800;letter-spacing:-.025em;line-height:1.1;margin:6px 0 10px}
.region-desc{font-size:18px;color:var(--ink2);line-height:1.6;max-width:680px}
.region-meta{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--label);margin-top:12px}
.region-meta .dot{width:4px;height:4px;border-radius:50%;background:var(--line)}

/* ── Airbnb-style city tiles ────────────────────────── */
.city-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:32px 22px;margin-top:32px}
.city-card{display:block;color:var(--ink);border-radius:18px}
.city-card:focus-visible{outline:3px solid var(--terra);outline-offset:4px}

.city-img-wrap{position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:var(--chip-bg,#F2EADC)}
.city-img-wrap::after{content:"";position:absolute;inset:0;border-radius:16px;box-shadow:inset 0 0 0 1px rgba(56,48,38,.07);pointer-events:none}
.city-img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transform:scale(1.02);transition:opacity .45s ease,transform .5s ease}
.city-img.loaded{opacity:1;transform:scale(1)}
.city-card:hover .city-img.loaded{transform:scale(1.06)}

/* skeleton shimmer while the photo loads */
.city-img-wrap.loading::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(0,0,0,0) 20%,rgba(255,255,255,.55) 50%,rgba(0,0,0,0) 80%);background-size:220% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{0%{background-position:120% 0}100%{background-position:-120% 0}}

/* fallback when no photo is available */
.city-fallback{position:absolute;inset:0;display:grid;place-items:center;font-size:52px;font-weight:800;color:rgba(255,255,255,.92);letter-spacing:-.02em;text-shadow:0 2px 12px rgba(0,0,0,.18)}

.city-badge{position:absolute;top:12px;left:12px;background:rgba(255,252,245,.95);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--ink);font-size:13px;font-weight:700;padding:7px 12px;border-radius:999px;box-shadow:0 2px 8px rgba(60,42,20,.14)}

.city-body{padding:14px 2px 0}
.city-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.city-name{font-size:19px;font-weight:700;letter-spacing:-.012em;line-height:1.25}
.city-dur{display:inline-flex;align-items:center;gap:5px;font-size:15px;font-weight:600;color:var(--ink2);white-space:nowrap;flex-shrink:0;padding-top:1px}
.city-sub{font-size:15px;color:var(--ink2);line-height:1.5;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.city-foot{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:15px;color:var(--label)}
.city-accent{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.city-go{margin-top:11px;display:inline-flex;align-items:center;gap:7px;font-size:16px;font-weight:700;color:var(--terra)}
.city-go .arrow{transition:transform .2s ease}
.city-card:hover .city-go .arrow{transform:translateX(4px)}

/* ── Other regions ──────────────────────────────────── */
.other-regions{margin-top:64px;padding-top:32px;border-top:1px solid var(--line)}
.other-region-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:16px}
.other-region-tile{background:var(--parchment);border-radius:16px;padding:18px;box-shadow:var(--sh1);border:2px solid transparent;display:flex;align-items:center;gap:12px;color:var(--ink);transition:border-color .15s,transform .15s}
.other-region-tile:hover{border-color:var(--terra);transform:translateY(-2px)}

.state-msg{text-align:center;padding:80px 20px;font-size:19px;color:var(--ink2);line-height:1.6}
.state-msg a{color:var(--terra);font-weight:700;text-decoration:underline}

@media(max-width:799px){.nav-desktop{display:none!important}}
@media(min-width:800px){.nav-mobile{display:none!important}}
@media(max-width:560px){.region-name{font-size:32px}.city-grid{gap:28px 16px}}
@media(prefers-reduced-motion:reduce){
  .city-img,.city-card:hover .city-img.loaded,.city-go .arrow{transition:none;transform:none}
  .city-img-wrap.loading::before{animation:none}
}
</style>
</head>
<body>

<!-- Sticky nav -->
<nav class="sticky-nav">
  <div class="sticky-nav-inner">
    <a href="./" class="logo">
      <span class="logo-name">quolino</span><span class="logo-dot">.</span><span class="logo-tld">com</span>

        </button>
        <a class="bmc-link" href="https://buymeacoffee.com/questini" target="_blank" rel="noopener">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 6h14v2H3zm0 4h14v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zm14-4h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M7 2v4M11 2v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg><span data-ui="nav.support">Wesprzyj</span>

        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg>

<!-- Mobile drawer -->
<div id="mobileDrawer" style="display:none;position:fixed;inset:0;z-index:200;background:rgba(56,48,38,.4)" onclick="this.style.display='none'">
  <div style="position:absolute;top:0;left:0;right:0;background:var(--parchment);border-radius:0 0 20px 20px;box-shadow:0 8px 32px rgba(60,42,20,.18);padding:0 20px 28px" onclick="event.stopPropagation()">
    <div style="display:flex;align-items:center;justify-content:space-between;min-height:56px">
      <div class="logo"><span class="logo-name">quolino</span><span class="logo-dot">.</span><span class="logo-tld">com</span></div>
      <button onclick="document.getElementById('mobileDrawer').style.display='none'" aria-label="Close" style="width:48px;height:48px;border:none;cursor:pointer;border-radius:12px;background:transparent;display:grid;place-items:center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>

    <a href="./" onclick="document.getElementById('mobileDrawer').style.display='none'" style="display:flex;align-items:center;justify-content:center;height:52px;background:rgba(180,80,46,.06);border:2px solid var(--terra);border-radius:14px;font-size:18px;font-weight:700;color:var(--terra);margin-bottom:16px" data-ui="nav.select_region">Wybierz region</a>
    <div style="font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--label);margin-bottom:10px" data-ui="nav.lang_label">Język</div>

      <img src="https://flagcdn.com/w40/pl.png" alt="" id="drawerFlagImg" style="width:22px;height:16px;border-radius:3px;border:1px solid rgba(56,48,38,.12);object-fit:cover"> <span data-ui="nav.change_lang">Zmień język</span>

</div>

<!-- Language popup -->
<div class="lang-overlay" id="langPopup" onclick="this.classList.remove('open')">
  <div class="lang-popup" onclick="event.stopPropagation()">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <div style="font-size:22px;font-weight:800;letter-spacing:-.015em" data-ui="nav.select_lang">Wybierz język</div>
      <button onclick="document.getElementById('langPopup').classList.remove('open')" aria-label="Close" style="width:44px;height:44px;border:none;cursor:pointer;border-radius:12px;background:transparent;display:grid;place-items:center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>

</div>

<div class="wrap-wide">

  <!-- Breadcrumbs -->
  <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>

  <!-- Country content -->

    <div class="state-msg">&#8230;</div>
  </div>

  <div class="footer">
    <div class="logo" style="justify-content:center;margin-bottom:8px">
      <span class="logo-name">quolino</span><span class="logo-dot">.</span><span class="logo-tld">com</span>
    </div>
    <span data-ui="home.footer">&copy; 2026 &middot; Rodzinne przewodniki wypadowe</span>
  </div>

</div>

<script>
// ══════════════ CONFIG ══════════════
var SB_URL = 'https://ntwpjcupffdozstbijhh.supabase.co/rest/v1';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50d3BqY3VwZmZkb3pzdGJpamhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMzc5MTUsImV4cCI6MjEwMjgxMzkxNX0.OddjLt-gKKmj2H7wrEKJ14CXrsXu0L4UBO2GC9OiCGo';
var FALLBACK = 'pl';
var IMG_TTL = 7 * 24 * 3600 * 1000;   // photo URL cache: 7 days
var IMG_WIDTH = 800;

// ══════════════ STATE ══════════════
var countrySlug = new URLSearchParams(location.search).get('k');
var currentLang = new URLSearchParams(location.search).get('lang') || readPref() || FALLBACK;
var langList = [];
var uiStrings = {};

// ══════════════ HELPERS ══════════════
function sb(table, params) {
  var url = SB_URL + '/' + table + (params ? '?' + params : '');
  return fetch(url, { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY } })
    .then(function(r) { if (!r.ok) throw new Error(r.status + ' ' + table); return r.json(); });
}
function readPref()  { try { return localStorage.getItem('quolino_lang'); } catch(e) { return null; } }
function savePref(l) { try { localStorage.setItem('quolino_lang', l); } catch(e) {} }
function esc(s) { if (s == null) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function ui(key, fb) { return uiStrings[key] || fb || key; }

// ══════════════ PHOTOS (Wikipedia) ══════════════
// Region nie ma wlasnego zdjecia — bierzemy pierwsze miasto regionu.
function cachedImg(slug) {
  try {
    var raw = localStorage.getItem('quolino_img3_' + slug);
    if (!raw) return null;
    var o = JSON.parse(raw);
    if (!o.ts || Date.now() - o.ts > IMG_TTL) return null;
    return o.url;
  } catch(e) { return null; }
}
function cacheImg(slug, url) {
  try { localStorage.setItem('quolino_img3_' + slug, JSON.stringify({ url: url || '', ts: Date.now() })); } catch(e) {}
}
function wikiThumb(city) {
  var lang = city.wiki_lang || 'it';
  var url = 'https://' + lang + '.wikipedia.org/w/api.php'
          + '?action=query&prop=pageimages&format=json&origin=*'
          + '&pithumbsize=' + IMG_WIDTH
          + '&titles=' + encodeURIComponent(String(city.wiki_article));
  return fetch(url)
    .then(function(r) { if (!r.ok) throw new Error('wiki ' + r.status); return r.json(); })
    .then(function(j) {
      var pages = j && j.query && j.query.pages;
      if (!pages) return '';
      var k = Object.keys(pages)[0];
      var th = pages[k] && pages[k].thumbnail;
      return (th && th.source) ? th.source : '';
    });
}
function showFallback(wrap, color, letter) {
  wrap.classList.remove('loading');
  if (wrap.querySelector('.city-fallback')) return;
  wrap.style.background = 'linear-gradient(135deg,' + (color || '#B4502E') + ' 0%, rgba(56,48,38,.55) 100%)';
  var d = document.createElement('div');
  d.className = 'city-fallback';
  d.textContent = (letter || '?').charAt(0).toUpperCase();
  wrap.appendChild(d);
}
function paintImage(wrap, url, color, letter) {
  if (!url) { showFallback(wrap, color, letter); return; }
  var img = document.createElement('img');
  img.className = 'city-img'; img.alt = ''; img.loading = 'lazy'; img.decoding = 'async';
  img.onload  = function() { wrap.classList.remove('loading'); img.classList.add('loaded'); };
  img.onerror = function() { img.remove(); showFallback(wrap, color, letter); };
  img.src = url;
  wrap.appendChild(img);
}
function loadCover(wrap, city, letter) {
  if (!city) { showFallback(wrap, null, letter); return; }
  var color = city.bandana_color;
  if (city.hero_image) { paintImage(wrap, city.hero_image, color, letter); return; }
  var c = cachedImg(city.slug);
  if (c !== null) { paintImage(wrap, c, color, letter); return; }
  if (!city.wiki_article) { showFallback(wrap, color, letter); return; }
  wikiThumb(city)
    .then(function(url) { cacheImg(city.slug, url); paintImage(wrap, url, color, letter); })
    .catch(function() { showFallback(wrap, color, letter); });
}

// ══════════════ LOAD PAGE ══════════════
function loadPage(lang) {
  currentLang = lang;
  savePref(lang);
  document.documentElement.lang = lang;

  if (!countrySlug) { fail('Brak parametru kraju.'); return; }

  Promise.all([
    sb('languages', 'enabled=eq.true&order=priority'),
    sb('ui_translations', 'lang=eq.' + lang),
    sb('regions', 'select=*&order=sort_order'),
    sb('region_translations', 'lang=eq.' + lang),
    sb('countries', 'select=*&order=sort_order'),
    sb('country_translations', 'lang=eq.' + lang),
    sb('cities', 'status=eq.published&select=slug,region_slug,bandana_color,hero_image,wiki_article,wiki_lang,sort_order&order=sort_order')
  ]).then(function(res) {
    langList        = res[0];
    var uiRows      = res[1];
    var allRegions  = res[2];
    var regionTrs   = res[3];
    var countries   = res[4];
    var countryTrs  = res[5];
    var allCities   = res[6];

    uiStrings = {};
    uiRows.forEach(function(r) { uiStrings[r.key] = r.value; });

    buildLangPopup();
    updateActiveLang();
    document.querySelectorAll('[data-ui]').forEach(function(el) {
      var v = uiStrings[el.getAttribute('data-ui')];
      if (v) el.textContent = v;
    });

    var country = countries.filter(function(c) { return c.slug === countrySlug; })[0];
    if (!country) { fail(ui('error.country_not_found', 'Nie znaleźliśmy tego kraju.')); return; }

    var cTr         = countryTrs.filter(function(t) { return t.country_slug === countrySlug; })[0];
    var countryName = cTr ? cTr.name : countrySlug;
    var continent   = country.continent || 'europe';

    document.title = countryName + ' — Quolino';
    buildCrumbs(continent, countryName);
    buildCountry(country, countryName, allRegions, regionTrs, allCities,
                 countries, countryTrs);
  }).catch(function(err) {
    console.error('Supabase error:', err);
    fail(ui('error.load', 'Nie udało się wczytać danych. Odśwież stronę.'));
  });
}

function fail(msg) {
  document.getElementById('pageContent').innerHTML =
    '<div class="state-msg">' + esc(msg) + '<br><br><a href="./">' + esc(ui('nav.home', 'Strona główna')) + '</a></div>';
}

// ══════════════ BREADCRUMBS ══════════════
// 🏠 › Europa › Włochy
function buildCrumbs(continent, countryName) {
  var nav = document.getElementById('crumbs');
  if (!nav) return;
  var homeLabel = ui('nav.home', 'Strona główna');
  var html = '';

  html += '<a class="crumb-home" href="./" title="' + esc(homeLabel) + '" aria-label="' + esc(homeLabel) + '">' +
            '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>' +
          '</a>';

  var levels = [
    { label: ui('continent.' + continent, 'Europa'), href: './#regiony' },
    { label: countryName,                            href: null }
  ];

  levels.forEach(function(l) {
    if (!l.label) return;
    html += '<span class="crumb-sep" aria-hidden="true">&rsaquo;</span>';
    html += l.href
      ? '<a href="' + l.href + '">' + esc(l.label) + '</a>'
      : '<span class="crumb-current" aria-current="page">' + esc(l.label) + '</span>';
  });

  nav.innerHTML = html;
}

// ══════════════ KRAJ + KAFLE REGIONÓW ══════════════
function buildCountry(country, countryName, allRegions, regionTrs, allCities,
                      countries, countryTrs) {
  var el = document.getElementById('pageContent');
  var html = '';

  // miasta pogrupowane po regionie (juz posortowane sort_order)
  var byRegion = {};
  allCities.forEach(function(c) {
    if (!byRegion[c.region_slug]) byRegion[c.region_slug] = [];
    byRegion[c.region_slug].push(c);
  });

  var regions = allRegions.filter(function(r) {
    return r.country_slug === country.slug && byRegion[r.slug] && byRegion[r.slug].length;
  });
  var cityTotal = regions.reduce(function(n, r) { return n + byRegion[r.slug].length; }, 0);

  // ── Hero ──
  html += '<div class="region-hero">';
  html += '<div class="caps" style="font-size:14px">' + esc(ui('continent.' + (country.continent || 'europe'), 'Europa')) + '</div>';
  html += '<h1 class="region-name">' + esc(countryName);
  if (country.flag_code) html += ' <img src="https://flagcdn.com/w40/' + country.flag_code + '.png" alt="" style="width:36px;height:25px;border-radius:4px;vertical-align:middle;margin-left:8px">';
  html += '</h1>';
  html += '<div class="region-meta"><span>' + cityTotal + ' ' + esc(ui('home.region_ready', 'gotowe plany')) + '</span></div>';
  html += '</div>';

  if (!regions.length) {
    html += '<div class="state-msg">' + esc(ui('error.no_regions', 'Jeszcze nic tu nie ma — wracamy wkrótce.')) + '</div>';
    el.innerHTML = html;
    return;
  }

  // ── Kafle regionów ──
  html += '<div class="city-grid" id="regionGrid"></div>';

  // ── Inne kraje ──
  var otherCountries = countries.filter(function(c) {
    if (c.slug === country.slug) return false;
    return allRegions.some(function(r) {
      return r.country_slug === c.slug && byRegion[r.slug] && byRegion[r.slug].length;
    });
  });

  if (otherCountries.length) {
    html += '<div class="other-regions"><p class="caps">' + esc(ui('label.other_countries', 'Inne kraje')) + '</p><div class="other-region-grid">';
    otherCountries.forEach(function(oc) {
      var oTr   = countryTrs.filter(function(t) { return t.country_slug === oc.slug; })[0];
      var oName = oTr ? oTr.name : oc.slug;
      var oCnt  = allRegions.filter(function(r) { return r.country_slug === oc.slug; })
                            .reduce(function(n, r) { return n + ((byRegion[r.slug] || []).length); }, 0);
      html += '<a class="other-region-tile" href="country.html?k=' + encodeURIComponent(oc.slug) + '">';
      html += '<div style="flex:1"><div style="font-size:19px;font-weight:800;letter-spacing:-.01em">' + esc(oName);
      if (oc.flag_code) html += ' <img src="https://flagcdn.com/w40/' + oc.flag_code + '.png" alt="" style="width:18px;height:13px;border-radius:2px;vertical-align:middle;margin-left:4px">';
      html += '</div><div style="font-size:14px;color:var(--label);margin-top:2px">' + oCnt + ' ' + esc(ui('home.region_ready', 'gotowe plany')) + '</div></div>';
      html += '<div style="font-size:19px;color:var(--terra)">&rarr;</div></a>';
    });
    html += '</div></div>';
  }

  el.innerHTML = html;

  var grid = document.getElementById('regionGrid');
  regions.forEach(function(reg) {
    var rTr        = regionTrs.filter(function(t) { return t.region_slug === reg.slug; })[0];
    var regionName = rTr ? rTr.name : reg.slug;
    var regCities  = byRegion[reg.slug];

    var card = document.createElement('a');
    card.className = 'city-card';
    card.href = 'region.html?r=' + encodeURIComponent(reg.slug);

    var wrap = document.createElement('div');
    wrap.className = 'city-img-wrap loading';
    card.appendChild(wrap);

    var body = document.createElement('div');
    body.className = 'city-body';
    body.innerHTML =
      '<div class="city-head"><div class="city-name">' + esc(regionName) + '</div></div>' +
      (rTr && rTr.description ? '<div class="city-sub">' + esc(rTr.description) + '</div>' : '') +
      '<div class="city-foot"><span>' + regCities.length + ' ' + esc(ui('home.region_ready', 'gotowe plany')) + '</span></div>' +
      '<div class="city-go"><span>' + esc(ui('home.cta_open', 'Zaczynamy!')) + '</span><span class="arrow" aria-hidden="true">&rarr;</span></div>';
    card.appendChild(body);

    grid.appendChild(card);
    loadCover(wrap, regCities[0], regionName);
  });
}

// ══════════════ LANGUAGE POPUP ══════════════
function buildLangPopup() {
  var grid = document.getElementById('langGrid');
  if (!grid) return;
  grid.innerHTML = '';
  langList.forEach(function(l) {
    var btn = document.createElement('button');
    btn.innerHTML = '<img src="https://flagcdn.com/w40/' + (l.flag_code || l.code) + '.png" alt="">' + esc(l.name_native);
    if (l.code === currentLang) btn.classList.add('active');
    btn.addEventListener('click', function() {
      document.getElementById('langPopup').classList.remove('open');
      if (l.code !== currentLang) loadPage(l.code);
    });
    grid.appendChild(btn);
  });
}

function updateActiveLang() {
  var l = langList.filter(function(x) { return x.code === currentLang; })[0];
  var flag = (l && l.flag_code) ? l.flag_code : currentLang;
  var img = document.getElementById('activeFlagImg');
  var dimg = document.getElementById('drawerFlagImg');
  var code = document.getElementById('activeLangCode');
  if (img)  img.src  = 'https://flagcdn.com/w40/' + flag + '.png';
  if (dimg) dimg.src = 'https://flagcdn.com/w40/' + flag + '.png';
  if (code) code.textContent = currentLang.toUpperCase();
}

// ══════════════ KEYBOARD ══════════════
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    document.getElementById('langPopup').classList.remove('open');
    document.getElementById('mobileDrawer').style.display = 'none';
  }
});

// ══════════════ INIT ══════════════
loadPage(currentLang);
</script>
</body>
</html>
