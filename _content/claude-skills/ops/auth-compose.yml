# Konta Quolino — Supabase Auth (GoTrue) na naszym VPS. OSOBNY projekt compose, nie dotyka docker-compose.override.yml.
# Plan: docs/LOGOWANIE.md. Od 2026-10-18 (JP): rejestracja e-mail + hasło z linkiem potwierdzającym, logowanie e-mail + hasło,
# reset hasła linkiem. Rejestracja i reset idą przez bramkę auth-gate (ALTCHA, limity) — boty nie założą kont. Google dojdzie konfiguracją.
# Od 2026-10-29 (JP, D-1): logowanie KODEM Z MAILA (6 cyfr, ważny 15 min), hasło opcjonalne. POST /otp idzie przez bramkę (ALTCHA, limity),
# kod sprawdza POST /verify {type:"email"}. Nowy przepływ na stronie włącza się sam, gdy bramka odpowiada na GET /otp (OTP_LOGIN=1).
# Cofnięcie: OTP_LOGIN "0" w auth-gate (strona wraca do hasła) albo git revert tej zmiany + deploy.sh approve.
# Uruchomienie (root): sh /root/quolino-web/ops/auth-init.sh   (tworzy sekrety, rolę i schemat „auth”, startuje kontener).
# Sekrety (JWT, hasło bazy, SMTP Brevo) są w /root/quolino-web/secrets/gotrue.env — tworzy je auth-init.sh. Nic tajnego w repo.
# Adres publiczny: https://auth.quolino.com/auth/v1/…  (prefiks /auth/v1 jak w Supabase; Traefik go obcina).
name: quolino-auth
services:
  gotrue:
    image: supabase/gotrue:v2.197.0        # wersja przypięta; migracje sprawdzone na PG17 2026-10-17
    restart: unless-stopped
    env_file:
      - path: ../secrets/gotrue.env
        required: false
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: "9999"
      API_EXTERNAL_URL: https://auth.quolino.com/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_SITE_URL: https://quolino.com
      GOTRUE_URI_ALLOW_LIST: https://quolino.com/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: "10"
      # e-mail: kod 6 cyfr (logowanie i zakładanie konta, 2026-10-29); hasło opcjonalne; reset hasła linkiem
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"            # nowe konto potwierdza się wpisaniem kodu (albo linkiem z tego samego maila)
      GOTRUE_MAILER_OTP_LENGTH: "6"
      GOTRUE_MAILER_OTP_EXP: "900"                   # 15 min — kod, link z kodem i link resetu hasła (było 3600)
      GOTRUE_SMTP_MAX_FREQUENCY: 60s                 # nowy kod na ten sam adres najwcześniej po 60 s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "60"
      GOTRUE_RATE_LIMIT_OTP: "30"                    # POST /otp: 30 na 5 min na IP (domyślne, wpisane jawnie)
      GOTRUE_RATE_LIMIT_VERIFY: "30"                 # POST /verify (sprawdzenie kodu): 30 na 5 min na IP — hamuje zgadywanie kodu
      GOTRUE_RATE_LIMIT_HEADER: X-Real-Ip
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: "{{ .Token }} — Twój kod do Quolino"
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: "{{ .Token }} — Twój kod do Quolino"
      GOTRUE_MAILER_SUBJECTS_RECOVERY: "Nowe hasło do Quolino"
      GOTRUE_PASSWORD_MIN_LENGTH: "10"
      # jeden szablon z kodem: istniejące konto (magic link) i nowe konto (confirmation); stare link.html/confirm.html zostają do cofnięcia
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: https://quolino.com/auth-mail/code.html
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: https://quolino.com/auth-mail/code.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: https://quolino.com/auth-mail/reset.html
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_LOG_LEVEL: info
    networks: [proxy, db]
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9999/health || exit 1"]
      interval: 15s
      start_period: 5s
    labels:
      - traefik.enable=true
      - traefik.docker.network=quolino-web_default
      - traefik.http.routers.quolino-auth.rule=Host(`auth.quolino.com`) && PathPrefix(`/auth/v1`)
      - traefik.http.routers.quolino-auth.entrypoints=websecure
      - traefik.http.routers.quolino-auth.tls.certresolver=letsencrypt
      - traefik.http.routers.quolino-auth.middlewares=quolino-auth-strip
      - traefik.http.routers.quolino-auth.service=quolino-auth
      - traefik.http.middlewares.quolino-auth-strip.stripprefix.prefixes=/auth/v1
      # zamknięte z zewnątrz: /magiclink (omijałby bramkę), zaproszenia, panel administracyjny GoTrue. /otp idzie przez bramkę (niżej).
      - traefik.http.routers.quolino-auth-deny.rule=Host(`auth.quolino.com`) && (PathPrefix(`/auth/v1/magiclink`) || PathPrefix(`/auth/v1/invite`) || PathPrefix(`/auth/v1/admin`) || PathPrefix(`/auth/v1/otp/`))
      - traefik.http.routers.quolino-auth-deny.priority=1000
      - traefik.http.routers.quolino-auth-deny.entrypoints=websecure
      - traefik.http.routers.quolino-auth-deny.tls.certresolver=letsencrypt
      - traefik.http.routers.quolino-auth-deny.middlewares=quolino-auth-block
      - traefik.http.routers.quolino-auth-deny.service=quolino-auth
      - traefik.http.middlewares.quolino-auth-block.ipallowlist.sourcerange=127.0.0.1/32
      - traefik.http.services.quolino-auth.loadbalancer.server.port=9999
  # bramka rejestracji, resetu hasła i kodu logowania: ALTCHA + limity, dopiero potem GoTrue
  # (gate/auth-gate.mjs, SQL 2026-10-18-auth-gate.sql + 2026-10-29-auth-gate-otp.sql)
  auth-gate:
    image: node:22-alpine
    restart: unless-stopped
    command: ["node", "/app/auth-gate.mjs"]
    volumes:
      - /root/quolino-web/gate/auth-gate.mjs:/app/auth-gate.mjs:ro
    environment:
      GOTRUE_URL: http://gotrue:9999
      API_URL: http://quolino-web-api-1:3000     # PostgREST z projektu quolino-web (ta sama sieć proxy)
      ALLOW_ORIGIN: https://quolino.com
      OTP_LOGIN: "1"        # logowanie kodem z maila; "0" = strona wraca do logowania hasłem (bez zmian w GoTrue)
      OTP_LENGTH: "6"       # musi być równe GOTRUE_MAILER_OTP_LENGTH
    depends_on: [gotrue]
    networks: [proxy]
    mem_limit: 96m
    cpus: 0.25
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      start_period: 5s
    labels:
      - traefik.enable=true
      - traefik.docker.network=quolino-web_default
      - traefik.http.routers.quolino-auth-gate.rule=Host(`auth.quolino.com`) && (Path(`/auth/v1/signup`) || Path(`/auth/v1/recover`) || Path(`/auth/v1/otp`))
      - traefik.http.routers.quolino-auth-gate.priority=900
      - traefik.http.routers.quolino-auth-gate.entrypoints=websecure
      - traefik.http.routers.quolino-auth-gate.tls.certresolver=letsencrypt
      - traefik.http.routers.quolino-auth-gate.middlewares=quolino-auth-strip
      - traefik.http.routers.quolino-auth-gate.service=quolino-auth-gate
      - traefik.http.services.quolino-auth-gate.loadbalancer.server.port=8080
networks:
  proxy:
    external: true
    name: quolino-web_default
  db:
    external: true
    name: postgresql-5bap_default
