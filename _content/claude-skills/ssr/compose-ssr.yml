# Dopisać do /root/quolino-web/docker-compose.override.yml (sekcja services:).
# Strony miast z bazy: /{lang}/{region}/{miasto}/ i /sitemap.xml — reszta strony bez zmian (kontener web).
# Etykiety Traefika: skopiować nazwy entrypoint/certresolver z istniejącej usługi „web” (te same wartości).
  ssr:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.mjs"]
    environment:
      API_URL: http://api:3000            # PostgREST w tej samej sieci (nazwa usługi z docker-compose.yml)
      SITE_URL: https://quolino.srv1984679.hstgr.cloud   # po przełączeniu DNS: https://questini.com
      TEMPLATE: /site/city.html
      CACHE_SECONDS: "300"
    volumes:
      - ./ssr/server.mjs:/app/server.mjs:ro
      - ./site:/site:ro                   # ten sam checkout repo co strona
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 60s
    labels:
      - traefik.enable=true
      - traefik.http.routers.quolino-ssr.rule=Host(`quolino.srv1984679.hstgr.cloud`) && (PathRegexp(`^/[a-z]{2}(-[a-z]{2})?/[a-z0-9-]+/[a-z0-9-]+/?$`) || Path(`/sitemap.xml`))
      - traefik.http.routers.quolino-ssr.priority=100
      - traefik.http.routers.quolino-ssr.entrypoints=websecure          # jak w usłudze web
      - traefik.http.routers.quolino-ssr.tls.certresolver=letsencrypt   # jak w usłudze web
      - traefik.http.services.quolino-ssr.loadbalancer.server.port=8080
