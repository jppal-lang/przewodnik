# Dopisać do /root/quolino-web/docker-compose.override.yml (sekcja services:).
# Strony miast z bazy: /{lang}/{kraj}/{region}/{miasto}/ (nowy schemat), 301 ze starych adresów (/{lang}/{region}/{miasto}/, /city.html, /wlochy/*.html)
# oraz strony krajów i regionów /{lang}/{kraj}/ i /{lang}/{kraj}/{region}/ (region.html / country.html z serwera, 200; od 2026-10-18) i /sitemap.xml — reszta strony bez zmian (kontener web). Zmiana etykiet = `docker compose up -d ssr` (deploy.sh approve robi to sam).
# UWAGA: w pliku compose „$” trzeba pisać jako „$$” (poniżej już tak jest).
# Etykiety Traefika: skopiować nazwy entrypoint/certresolver z istniejącej usługi „web” (te same wartości).
  ssr:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.mjs"]
    environment:
      API_URL: http://api:3000            # PostgREST w tej samej sieci (nazwa usługi z docker-compose.yml)
      SITE_URL: https://quolino.com   # po przełączeniu DNS: https://quolino.com
      TEMPLATE: /site/city.html
      CACHE_SECONDS: "300"
    volumes:
      - ./ssr/server.mjs:/app/server.mjs:ro
      - ./site:/site:ro                   # ten sam checkout repo co strona
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 60s
    labels:
      - traefik.enable=true
      - traefik.http.routers.quolino-ssr.rule=Host(`quolino.com`) && (PathRegexp(`^/[a-z]{2}(-[a-z]{2})?(/[a-z0-9-]+){1,3}/?$$`) || Path(`/sitemap.xml`) || Path(`/city.html`) || PathRegexp(`^/wlochy/[a-z0-9-]+/(ancona|asyz|frasassi|perugia|rawenna|rimini|urbino)\.html$$`))
      - traefik.http.routers.quolino-ssr.priority=100
      - traefik.http.routers.quolino-ssr.entrypoints=websecure          # jak w usłudze web
      - traefik.http.routers.quolino-ssr.tls.certresolver=letsencrypt   # jak w usłudze web
      - traefik.http.services.quolino-ssr.loadbalancer.server.port=8080
